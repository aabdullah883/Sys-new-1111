<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#132A3F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="موارد السلمان">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>نظام الموارد البشرية | المعاملات والخدمات الذاتية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0E1B2A;--ink-2:#1B2E44;--paper:#EDF1F5;--card:#FFFFFF;--line:#DCE3EB;
  --green:#0B6B53;--green-soft:#E3F1EC;--gold:#B08D2B;--gold-soft:#FBF3DD;
  --red:#A8323A;--red-soft:#FAE7E8;--blue:#1F5FA8;--blue-soft:#E6EFF9;
  --purple:#5B4B8A;--purple-soft:#EEEBF6;--muted:#64748B;--r:14px;
  --shadow:0 1px 2px rgba(14,27,42,.06),0 8px 24px rgba(14,27,42,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Tajawal','Segoe UI',Tahoma,sans-serif;background:var(--paper);color:var(--ink);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:'Readex Pro','Tajawal',Tahoma,sans-serif;font-weight:600;letter-spacing:-.2px;margin:0}
button,input,select,textarea{font-family:inherit;font-size:15px}
.num{font-variant-numeric:tabular-nums;direction:ltr;display:inline-block}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#C3CCD8;border-radius:20px;border:3px solid var(--paper)}

.login{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr}
.login-brand{background:radial-gradient(1200px 600px at 90% -10%,#17415C 0%,transparent 55%),linear-gradient(200deg,var(--ink-2),var(--ink) 70%);
  color:#fff;padding:52px 56px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.login-brand:after{content:"";position:absolute;inset:auto -120px -160px auto;width:520px;height:520px;border-radius:50%;border:1px solid rgba(255,255,255,.09);box-shadow:0 0 0 60px rgba(255,255,255,.04)}
.logo{display:flex;align-items:center;gap:14px}
.logo-mark{width:52px;height:52px;border-radius:15px;background:linear-gradient(160deg,var(--gold),#8A6B16);display:grid;place-items:center;font-size:21px;font-weight:700;color:#fff;box-shadow:0 8px 20px rgba(176,141,43,.35)}
.login-brand h1{font-size:36px;line-height:1.4;margin:0 0 14px;font-weight:600}
.login-brand p{color:#B7C6D6;max-width:46ch;margin:0}
.chain-demo{display:flex;align-items:center;margin-top:32px;flex-wrap:wrap;gap:0}
.chain-demo .node{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:16px;background:rgba(255,255,255,.07);border:1px dashed rgba(255,255,255,.28)}
.chain-demo .node.on{background:var(--gold);border:none;box-shadow:0 6px 18px rgba(176,141,43,.4)}
.chain-demo .link{height:1px;width:34px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.4) 0 5px,transparent 5px 10px)}
.login-facts{display:flex;gap:30px;color:#93A6BA;font-size:13px;flex-wrap:wrap}
.login-facts b{display:block;font-size:25px;color:#fff;font-family:'Readex Pro',sans-serif}
.login-form{background:var(--card);display:flex;align-items:center;justify-content:center;padding:40px}
.login-box{width:100%;max-width:410px}
.login-box h2{font-size:26px;margin-bottom:6px}
.sub{color:var(--muted);font-size:14px;margin:0 0 24px}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px;color:#334155}
.field .hint{font-weight:400;color:var(--muted);font-size:12px}
input[type=text],input[type=password],input[type=date],input[type=number],input[type=email],select,textarea{
  width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:11px;background:#FBFCFD;transition:.15s;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--green);background:#fff;box-shadow:0 0 0 4px var(--green-soft)}
textarea{min-height:84px;resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:11px;border:1px solid transparent;background:var(--ink);color:#fff;font-weight:700;cursor:pointer;transition:.15s;white-space:nowrap}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 18px rgba(14,27,42,.18)}
.btn.block{width:100%}
.btn.green{background:var(--green)}.btn.red{background:var(--red)}.btn.gold{background:var(--gold)}
.btn.ghost{background:#fff;border-color:var(--line);color:var(--ink)}
.btn.ghost:hover{border-color:#B9C4D2;box-shadow:none}
.btn.sm{padding:8px 13px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.demo-users{margin-top:22px;border-top:1px dashed var(--line);padding-top:16px}
.demo-users .t{font-size:12px;color:var(--muted);margin-bottom:9px}
.demo-chip{display:block;width:100%;text-align:start;background:#F7F9FB;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:6px;cursor:pointer;font-size:13px}
.demo-chip:hover{border-color:var(--green);background:var(--green-soft)}
.demo-chip span{color:var(--muted);float:inline-end;font-size:12px}
.err{background:var(--red-soft);color:var(--red);padding:10px 14px;border-radius:10px;font-size:13.5px;margin-bottom:14px;border:1px solid #F0CFD1}

.shell{display:grid;grid-template-columns:264px 1fr;min-height:100vh}
.side{background:var(--ink);color:#C7D3E0;padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.side .logo{margin:0 8px 22px;gap:11px}
.side .logo-mark{width:42px;height:42px;font-size:17px;border-radius:12px}
.side .logo b{color:#fff;font-size:15px;display:block;font-family:'Readex Pro',sans-serif}
.side .logo small{color:#8FA3B8;font-size:11.5px}
.nav-group{font-size:11px;color:#6F8299;margin:18px 10px 7px;letter-spacing:.6px}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:11px;cursor:pointer;margin-bottom:2px;font-size:14.3px;transition:.14s}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:linear-gradient(90deg,rgba(11,107,83,.2),rgba(255,255,255,.03));color:#fff;box-shadow:inset 3px 0 0 var(--gold)}
.nav-item .ic{width:22px;text-align:center;font-size:15px}
.badge{margin-inline-start:auto;background:var(--gold);color:#fff;border-radius:20px;padding:1px 8px;font-size:11.5px;font-weight:700}
.badge.rd{background:var(--red)}
.side-foot{margin-top:20px;border-top:1px solid rgba(255,255,255,.08);padding-top:12px}
.main{min-width:0;display:flex;flex-direction:column}
.top{background:rgba(255,255,255,.88);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 26px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:30}
.top h2{font-size:19px}
.top .crumb{color:var(--muted);font-size:12.5px}
.bell{position:relative;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#fff;cursor:pointer;display:grid;place-items:center;font-size:17px;margin-inline-start:auto}
.bell b{position:absolute;top:-6px;inset-inline-start:-6px;background:var(--red);color:#fff;font-size:11px;border-radius:20px;padding:1px 6px}
.userchip{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:40px;padding:5px 14px 5px 5px}
.avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--ink-2);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700;flex:none;overflow:hidden}
.avatar.lg{width:78px;height:78px;font-size:24px}
.userchip .nm{font-size:13.5px;font-weight:700;line-height:1.2}
.userchip .rl{font-size:11.5px;color:var(--muted)}
.content{padding:24px 26px 60px;max-width:1280px;width:100%}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card .hd{padding:15px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.card .hd h3{font-size:16px}
.card .hd .btn{margin-inline-start:auto}
.card .bd{padding:20px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:17px 19px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi .lb{font-size:13px;color:var(--muted)}
.kpi .vl{font-family:'Readex Pro',sans-serif;font-size:30px;font-weight:600;margin-top:3px;letter-spacing:-1px}
.kpi .ft{font-size:12px;color:var(--muted);margin-top:2px}
.kpi .ic{position:absolute;inset-inline-start:16px;top:15px;font-size:19px;opacity:.85}
.kpi.g{border-top:3px solid var(--green)}.kpi.o{border-top:3px solid var(--gold)}
.kpi.b{border-top:3px solid var(--blue)}.kpi.r{border-top:3px solid var(--red)}
.kpi.p{border-top:3px solid var(--purple)}
.kpi.clickable:hover{border-color:var(--green)}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 11px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap}
.t-pend{background:var(--gold-soft);color:#7A5F12}
.t-appr{background:var(--green-soft);color:var(--green)}
.t-rej{background:var(--red-soft);color:var(--red)}
.t-canc{background:#EEF1F5;color:var(--muted)}
.t-info{background:var(--blue-soft);color:var(--blue)}
.t-proc{background:var(--purple-soft);color:var(--purple)}
table{width:100%;border-collapse:collapse}
th{text-align:start;font-size:12.5px;color:var(--muted);font-weight:700;padding:11px 13px;border-bottom:1px solid var(--line);background:#F8FAFC;white-space:nowrap}
td{padding:11px 13px;border-bottom:1px solid #EEF2F6;font-size:14px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr{transition:.12s}
tbody tr:hover{background:#F9FBFC}
.clickable{cursor:pointer}
.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty .e{font-size:32px;display:block;margin-bottom:10px;opacity:.55}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar input,.toolbar select{width:auto;min-width:165px;padding:10px 13px;background:#fff}
.svc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;cursor:pointer;transition:.16s;box-shadow:var(--shadow);text-align:start}
.svc:hover{border-color:var(--green);transform:translateY(-3px)}
.svc .ic{width:44px;height:44px;border-radius:13px;background:var(--green-soft);display:grid;place-items:center;font-size:20px;margin-bottom:12px}
.svc h4{font-size:15px;margin-bottom:5px}
.svc p{margin:0;font-size:12.6px;color:var(--muted);line-height:1.6}
.svc .route{margin-top:11px;font-size:11.4px;color:var(--gold);font-weight:700;line-height:1.5}
.row-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.dl{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;font-size:14px}
.dl dt{color:var(--muted);font-size:13px}
.dl dd{margin:0;font-weight:500}

.trail{display:flex;align-items:flex-start;padding:20px 4px 6px;overflow-x:auto}
.trail .step{display:flex;flex-direction:column;align-items:center;min-width:116px;text-align:center}
.trail .seal{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:19px;background:#fff;border:2px dashed #C9D3DF;color:#94A3B8}
.trail .step.done .seal{border:2px solid var(--green);background:var(--green-soft);color:var(--green)}
.trail .step.now .seal{border:2px solid var(--gold);background:var(--gold-soft);color:#7A5F12;animation:pulse 2s infinite}
.trail .step.bad .seal{border:2px solid var(--red);background:var(--red-soft);color:var(--red)}
.trail .step.exec .seal{border:2px solid var(--purple);background:var(--purple-soft);color:var(--purple)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(176,141,43,.35)}50%{box-shadow:0 0 0 9px rgba(176,141,43,0)}}
.trail .rail{flex:1;height:2px;background:repeating-linear-gradient(90deg,#CBD5E1 0 6px,transparent 6px 12px);margin-top:27px;min-width:22px}
.trail .rail.done{background:var(--green)}
.trail .nm{font-size:12.3px;font-weight:700;margin-top:8px}
.trail .st{font-size:11.3px;color:var(--muted);line-height:1.5}
.trail .who{font-size:11.3px;color:var(--green);font-weight:700}
.timeline{border-inline-start:2px solid var(--line);margin-inline-start:10px;padding-inline-start:20px}
.tl-item{position:relative;padding-bottom:17px}
.tl-item:last-child{padding-bottom:0}
.tl-item:before{content:"";position:absolute;inset-inline-start:-27px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--line);border:2px solid #fff}
.tl-item.ok:before{background:var(--green)}.tl-item.no:before{background:var(--red)}
.tl-item.wt:before{background:var(--gold)}.tl-item.ex:before{background:var(--purple)}
.tl-item .h{font-size:14px;font-weight:700}
.tl-item .m{font-size:12.5px;color:var(--muted)}
.tl-item .n{font-size:13px;background:#F6F8FA;border-radius:9px;padding:8px 12px;margin-top:6px}
.bar-row{display:flex;align-items:center;gap:12px;margin-bottom:10px;font-size:13.5px}
.bar-row .lb{width:160px;flex:none;color:#334155}
.bar-track{flex:1;height:11px;background:#EEF2F6;border-radius:20px;overflow:hidden}
.bar-fill{height:100%;border-radius:20px;background:linear-gradient(90deg,var(--green),#149274)}
.bar-row .vl{width:50px;text-align:left;font-weight:700;font-size:13px}
.modal-bg{position:fixed;inset:0;background:rgba(9,17,28,.62);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:32px 16px;overflow-y:auto}
.modal{background:#fff;border-radius:18px;width:100%;max-width:680px;box-shadow:0 30px 70px rgba(0,0,0,.3);animation:up .22s ease}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.modal .hd{padding:17px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.modal .hd h3{font-size:17px}
.modal .bd{padding:20px}
.modal .ft{padding:15px 22px;border-top:1px solid var(--line);display:flex;gap:10px;background:#FAFBFC;border-radius:0 0 18px 18px;flex-wrap:wrap}
.x{margin-inline-start:auto;background:none;border:none;font-size:22px;cursor:pointer;color:var(--muted);line-height:1}
.upl{border:1.5px dashed #C4CFDC;border-radius:12px;padding:13px;text-align:center;cursor:pointer;background:#FAFBFC;font-size:13px;color:var(--muted);display:block}
.upl:hover{border-color:var(--green);color:var(--green)}
.upl img{max-height:120px;border-radius:8px;display:block;margin:0 auto 8px}
.note{background:var(--blue-soft);border:1px solid #CFE0F3;color:#14406F;padding:12px 15px;border-radius:11px;font-size:13.5px}
.note.warn{background:var(--gold-soft);border-color:#EBD9A6;color:#6E5410}
.note.bad{background:var(--red-soft);border-color:#F0CFD1;color:var(--red)}
.note.ok{background:var(--green-soft);border-color:#BFDCD2;color:var(--green)}
.toast{position:fixed;inset-block-end:24px;inset-inline-start:24px;background:var(--ink);color:#fff;padding:13px 20px;border-radius:12px;z-index:200;box-shadow:0 14px 34px rgba(0,0,0,.28);font-size:14px}
.pager{display:flex;gap:8px;align-items:center;justify-content:center;padding:13px;font-size:13px;color:var(--muted)}
.mini{font-size:12.5px;color:var(--muted)}
.sep{height:1px;background:var(--line);margin:16px 0}
.pill-row{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px}
.stat .top{display:flex;align-items:center;gap:12px}
.stat .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:20px;flex:none}
.stat .vl{font-family:'Readex Pro',sans-serif;font-size:28px;font-weight:600;line-height:1.2;letter-spacing:-1px}
.stat .lb{font-size:13px;color:var(--muted)}
.stat .lnk{margin-top:10px;padding-top:9px;border-top:1px solid #EEF2F6;font-size:12.5px;color:var(--blue);cursor:pointer;font-weight:700}
.stat .lnk:hover{text-decoration:underline}
.i-blue{background:#E8F0FB;color:#2563C9}.i-green{background:#E4F4EC;color:#12855F}
.i-amber{background:#FDF1DC;color:#9A6B10}.i-red{background:#FBE7E9;color:#B23744}
.i-violet{background:#EFEAFA;color:#6246C4}.i-teal{background:#E2F4F4;color:#0E7C86}
.punch{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.punch{grid-template-columns:1fr}}
.punch .box{border:1px solid var(--line);border-radius:14px;padding:18px;text-align:center;background:#FAFCFD}
.punch .box.in{background:#EEF6FF;border-color:#CFE0F3}
.punch .box.out{background:#EAF7F0;border-color:#BFDCD2}
.punch .tm{font-family:'Readex Pro',sans-serif;font-size:30px;font-weight:600;letter-spacing:-1px;margin:6px 0 12px}
.legend{display:flex;gap:16px;justify-content:center;font-size:12.5px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-inline-end:5px}
.chat-wrap{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
@media(max-width:900px){.chat-wrap{grid-template-columns:1fr}}
.conv{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid #EEF2F6;cursor:pointer;align-items:center}
.conv:hover{background:#F9FBFC}
.conv.on{background:var(--green-soft)}
.conv .nm{font-size:14px;font-weight:700}
.conv .ls{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
.conv .un{margin-inline-start:auto;background:var(--red);color:#fff;border-radius:20px;padding:1px 8px;font-size:11.5px;font-weight:700}
.msgs{height:52vh;overflow-y:auto;padding:16px;background:#F7F9FB;display:flex;flex-direction:column;gap:10px}
.msg{max-width:74%;padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.7;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.msg .t{font-size:11px;color:var(--muted);margin-top:4px}
.msg.me{align-self:flex-start;background:var(--green);color:#fff;border-end-start-radius:4px}
.msg.me .t{color:rgba(255,255,255,.75)}
.msg.you{align-self:flex-end;background:#fff;border:1px solid var(--line);border-end-end-radius:4px}
.msgbar{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);background:#fff}
.msgbar input{flex:1}
.notif{display:flex;gap:12px;padding:13px 16px;border-bottom:1px solid #EEF2F6;cursor:pointer}
.notif:hover{background:#F9FBFC}
.notif.un{background:#F4F9F7}
.notif .d{width:9px;height:9px;border-radius:50%;background:var(--green);margin-top:8px;flex:none}
.notif .d.off{background:transparent}
.notif .h{font-size:14px;font-weight:700}
.notif .m{font-size:13px;color:var(--muted)}
.notif .t{font-size:11.5px;color:#94A3B8;margin-inline-start:auto;white-space:nowrap}
@media(max-width:1000px){
  .login{grid-template-columns:1fr}.login-brand{display:none}
  .shell{grid-template-columns:1fr}
  .side{position:fixed;inset-inline-start:-280px;width:264px;z-index:60;transition:.25s}
  .side.open{inset-inline-start:0}
  .g4,.g3,.g2,.row-2{grid-template-columns:1fr}
  #dashrow,.grid[style*='1.15fr'],.grid[style*='1.1fr'],.grid[style*='repeat(5']{grid-template-columns:1fr!important}
  .content{padding:16px 12px 60px}.top{padding:11px 12px}
  .menu-btn{display:grid!important}
  .userchip .nm,.userchip .rl{display:none}
}

async function probeServer(){
  SRV_LAST_ERR='';
  try{
    if(typeof location==='undefined'||!/^https?:/.test(location.protocol)) return null;
    const base=(window.HR_API||(location.origin+(location.pathname.replace(/[^/]*$/,''))+'api')).replace(/\/+api$/,'/api');
    const ctrl=(typeof AbortController!=='undefined')?new AbortController():null;
    const t=ctrl?setTimeout(()=>ctrl.abort(),6000):null;
    let r;
    try{ r=await fetch(base+'/ping.php',{cache:'no-store',signal:ctrl?ctrl.signal:undefined}); }
    finally{ if(t) clearTimeout(t); }
    if(!r.ok){ SRV_LAST_ERR='رمز الاستجابة: '+r.status; return null; }
    const j=await r.json();
    if(!j||!j.ok){ SRV_LAST_ERR='استجابة غير متوقعة من السيرفر'; return null; }
    SRV_INIT=!!j.initialized; SRV_VER=j.version||0; DESKTOP_REMOTE=!!j.remote; DESKTOP_MODE=j.mode||'local'; DESKTOP_ONLINE=!!j.online; SYNC_PENDING=j.pending||0; SYNC_CONFLICTS=j.conflicts||0;

  }catch(e){
    SRV_LAST_ERR = (e&&e.name==='AbortError')?'انتهت مهلة الاتصال (6 ثوانٍ) — السيرفر لا يستجيب':(e&&e.message)||'تعذر الاتصال';
    return null;
  }
}
async function pullDB(){

}

      try{ const j=await r.json(); if(j&&j.error) msg=j.error; }catch(e){}

    if(!r.ok) return {ok:false, kind:'network', message:'رمز استجابة غير متوقع من السيرفر: '+r.status};

}

let LANG='ar';

function tr(x){ if(LANG==='ar'||!x) return x; const d=DICT[LANG]||{}; return d[String(x).trim()]||x; }
function applyDir(){
  try{
    const r=document.documentElement;
    r.setAttribute('lang',LANG);
    r.setAttribute('dir',(LANG==='en'||LANG==='fil')?'ltr':'rtl');
  }catch(e){}
}
function setLang(v){ LANG=v; try{ localStorage.setItem('hr_lang',v); }catch(e){} applyDir(); render(); }
function langSelect(cls){
  return '<select class="'+(cls||'')+'" onchange="setLang(this.value)" style="width:auto;padding:8px 10px;border-radius:10px;background:#fff">'+
    Object.keys(LANGS).map(k=>'<option value="'+k+'"'+(LANG===k?' selected':'')+'>'+LANGS[k]+'</option>').join('')+'</select>';
}
function translateDOM(root){
  if(LANG==='ar'||!root) return;
  const d=DICT[LANG]||{};
  try{
    const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null,false), ns=[];
    while(w.nextNode()) ns.push(w.currentNode);
    ns.forEach(n=>{ const t=n.nodeValue.trim(); if(!t) return; const v=d[t]; if(v) n.nodeValue=n.nodeValue.replace(t,v); });
    root.querySelectorAll('[placeholder]').forEach(el=>{ const v=d[(el.getAttribute('placeholder')||'').trim()]; if(v) el.setAttribute('placeholder',v); });
    root.querySelectorAll('[title]').forEach(el=>{ const v=d[(el.getAttribute('title')||'').trim()]; if(v) el.setAttribute('title',v); });
  }catch(e){}
}

function compress(file,max,q){return new Promise((res,rej)=>{
  const fr=new FileReader();
  fr.onload=()=>{const im=new Image();im.onload=()=>{let w=im.width,h=im.height;if(w>max){h=Math.round(h*max/w);w=max;}
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);res(c.toDataURL('image/jpeg',q||.72));};
    im.onerror=rej;im.src=fr.result;};
  fr.onerror=rej;fr.readAsDataURL(file);});}

function cfgOf(tk){ return (DB&&DB.settings&&DB.settings.chains&&DB.settings.chains[tk])||null; }
function chainFor(tk){
  const cfg=cfgOf(tk);
  let c=cfg?cfg.steps.slice():TYPES[tk].chain.slice();
  if(!cfg&&tk==='leave'&&DB&&DB.settings&&DB.settings.gmInLeave) c=['manager','branch','gm','hr'];
  if(cfg&&tk==='leave'&&DB.settings.gmInLeave&&c.indexOf('gm')<0) c.splice(Math.max(0,c.indexOf('hr')),0,'gm');
  if(cfg?cfg.exec:TYPES[tk].exec) c=c.concat(['exec']);
  return c.length?c:['hr'];
}
function slaFor(tk){ const c=cfgOf(tk); return (c&&c.sla)||TYPES[tk].sla; }
function pruneChain(e,steps){
  const bm=branchMgr(e.branch), hb=DB.employees.find(x=>x.role==='hr_branch'&&x.branch===e.branch);
  return steps.filter(r=>{
    if(r==='manager') return !!(e.managerId&&e.managerId!==e.id&&emp(e.managerId)&&['branch','hr','gm'].indexOf(e.role)<0);
    if(r==='branch') return !!(bm&&bm.id!==e.id);
    if(r==='hr_branch') return !!(hb&&hb.id!==e.id);
    if(r==='hr') return e.role!=='hr';
    if(r==='gm') return e.role!=='gm';
    return true;
  });
}
function effChain(e,tk){
  const full=chainFor(tk);
  let st=pruneChain(e,full.filter(r=>r!=='exec'));
  if(!st.length) st=[e.role==='hr'?'hr_staff':'hr'];
  if(full.indexOf('exec')>=0) st=st.concat(['exec']);
  return st;
}

    history:[], createdAt:new Date().toISOString(), dueAt:null, completedAt:null, waSent:false, exec:{}};
}
function stepTarget(r){
  const e=emp(r.empId), role=r.chain[r.step]?r.chain[r.step].role:null;
  if(role==='manager') return e.managerId;
  if(role==='branch'){const b=branchMgr(e.branch);return b?b.id:'1001';}
  if(role==='gm') return '1000';
  if(role==='hr_branch'){ const b=DB.employees.find(x=>x.role==='hr_branch'&&x.branch===e.branch); return b?b.id:'role:hr_staff'; }
  if(role==='hr') return 'role:hr';
  if(role==='hr_staff'||role==='exec') return 'role:hr_staff';
  return null;
}
function canAct(r,u){
  if(r.status!=='pending'&&r.status!=='processing') return false;
  const st=r.chain[r.step]; if(!st) return false;
  const e=emp(r.empId); if(!e) return false;
  if(st.role==='exec') return (u.role==='hr'||(u.role==='hr_staff'&&(!r.assignee||r.assignee===u.id)));
  if(r.empId===u.id) return false;
  if(st.role==='hr') return u.role==='hr';
  if(st.role==='gm') return u.role==='gm';
  if(st.role==='branch'){
    const bm=branchMgr(e.branch);
    if(u.role==='branch'&&u.branch===e.branch&&e.id!==u.id) return true;
    /* إذا كان مقدّم الطلب هو مدير الفرع نفسه أو لا يوجد مدير للفرع تنتقل الصلاحية للموارد البشرية */
    if((!bm||bm.id===e.id)&&(u.role==='hr'||u.role==='hr_staff')) return true;
    return false;
  }
  if(st.role==='manager'){
    if(u.role==='manager'&&e.managerId===u.id&&e.id!==u.id) return true;
    if(u.role==='branch'&&u.branch===e.branch&&(!e.managerId||e.managerId===e.id||!emp(e.managerId))) return true;
    if((u.role==='hr'||u.role==='hr_staff')&&(!emp(e.managerId)||e.managerId===e.id)) return true;
    return false;
  }
  if(st.role==='hr_staff') return u.role==='hr_staff'||u.role==='hr';
  if(st.role==='hr_branch') return (u.role==='hr_branch'&&u.branch===e.branch)||u.role==='hr'||(u.role==='hr_staff'&&!DB.employees.some(x=>x.role==='hr_branch'&&x.branch===e.branch));
  return false;
}

  st.status=action; st.by=ME.id; st.byName=ME.name; st.at=now; st.note=note||'';
  r.history.push({role:st.role,by:ME.id,byName:ME.name,byRole:ME.role,act:action,note:note||'',at:now});
  if(action==='reject'){
    r.status='rejected';
    notify(r.empId,'تم رفض معاملتك','المعاملة '+r.id+' رُفضت من '+STEP_NAME[st.role]+' ('+ME.name+'). السبب: '+(note||'—'),r.id);
  } else if(st.role==='exec'){
    r.exec=execData||{}; r.status='completed'; r.completedAt=now;
    applyEffects(r);
    addAchv(ME.id,'إنجاز معاملة','أنجز المعاملة '+r.id+' ('+TYPES[r.type].name+') للموظف '+e.name+
      (r.dueAt? (now.slice(0,10)<=r.dueAt?' — ضمن المدة المحددة':' — بعد انتهاء المدة'):''),r.id);
    notify(r.empId,'اكتملت إجراءات معاملتك','المعاملة '+r.id+' ('+TYPES[r.type].name+') أُنجزت بواسطة '+ME.name+' وأُعيدت إليك. '+(note||''),r.id);
    notify('role:hr','معاملة مكتملة','أنهى '+ME.name+' إجراءات المعاملة '+r.id+' للموظف '+e.name+'.',r.id);
  } else {
    r.step++;
    if(r.step>=r.chain.length){
      r.status='completed'; r.completedAt=now; applyEffects(r);
      if(r.type==='inquiry'){ r.reply=note; addAchv(ME.id,'رد على استفسار','رد على الاستفسار '+r.id+' المقدّم من '+e.name+'.',r.id);
        notify(r.empId,'وصلك رد على استفسارك','رد '+ME.name+' من قسم الموارد البشرية على استفسارك '+r.id+'.',r.id);
      } else {
        notify(r.empId,'اكتملت معاملتك','المعاملة '+r.id+' ('+TYPES[r.type].name+') اعتُمدت نهائياً بواسطة '+ME.name+'.',r.id);
      }
    } else {
      notify(r.empId,'تقدمت معاملتك خطوة','اعتمد '+ME.name+' ('+STEP_NAME[st.role]+') معاملتك '+r.id+'. المرحلة التالية: '+STEP_NAME[r.chain[r.step].role]+'.',r.id);
      if(r.chain[r.step].role==='exec'){ r.status='processing'; r.dueAt=addD(today(),slaFor(r.type)); }
      notifyCurrentStep(r);
    }
  }
  save(); render();
  toast(action==='reject'?'تم رفض المعاملة': st.role==='exec'?'تم إنهاء الإجراءات وإعادة الطلب للموظف':'تم الاعتماد وإحالتها للمرحلة التالية');
  if(r.status==='completed'&&DB.settings.waOn&&e.mobile) offerWhats(r);
}
function addAchv(empId,type,text,ref){
  const e=emp(empId); if(!e) return;
  e.achievements=e.achievements||[];
  e.achievements.push({id:'A'+Date.now().toString(36)+Math.floor(Math.random()*90),type,text,ref:ref||null,
    at:new Date().toISOString(),by:ME?ME.name:'النظام'});
}
function applyEffects(r){
  const e=emp(r.empId), x=r.exec||{};
  if(r.type==='iqama'&&x.newExpiry) e.iqamaExpiry=x.newExpiry;
  if(r.type==='contract'&&x.newEnd){ e.contractEnd=x.newEnd; e.contractDecision='مجدد'; }
  if(r.type==='insurance'&&x.newExpiry){ e.insurance.expiry=x.newExpiry; if(x.policy) e.insurance.policy=x.policy; }
  if(r.type==='leave'&&r.payload.leaveType==='سنوية') e.leaveBalance=Math.max(0,e.leaveBalance-(+r.payload.days||0));
  if(r.type==='eos'){ e.active=false; e.contractDecision='منتهي'; e.endedAt=new Date().toISOString(); e.endReason=r.payload.reason||'إنهاء علاقة عمل'; }
}
function offerWhats(r){
  const e=emp(r.empId);
  const txt='عزيزي '+e.name+'، تم إنهاء إجراءات معاملتك رقم '+r.id+' ('+TYPES[r.type].name+') لدى إدارة الموارد البشرية. يمكنك مراجعة التفاصيل عبر بوابة الموظف.';
  modal('✅ اكتملت الإجراءات',
   '<div class="note ok" style="margin-bottom:14px">أُعيدت المعاملة للموظف وسُجّل الإشعار داخل النظام. أرسل تنبيه واتساب لإبلاغه فوراً.</div>'+
   '<div class="field"><label>نص الرسالة</label><textarea id="waTxt">'+esc(txt)+'</textarea></div>'+
   '<div class="mini">سيُفتح واتساب على رقم الموظف: <span class="num">'+esc(e.mobile||'غير مسجل')+'</span></div>',
   '<button class="btn green" onclick="sendWhats(\''+r.id+'\')">📲 إرسال عبر واتساب</button><button class="btn ghost" onclick="closeModal()">لاحقاً</button>');
}
function sendWhats(rid){
  const r=DB.requests.find(x=>x.id===rid), e=emp(r.empId);
  window.open(waLink(e.mobile,$('waTxt').value),'_blank');
  r.waSent=true; r.history.push({role:'exec',byName:ME.name,byRole:ME.role,act:'wa',note:'أُرسل إشعار واتساب للموظف',at:new Date().toISOString()});
  save(); closeModal(); toast('فُتح واتساب لإرسال الإشعار'); render();

function statusTag(s,overdue){
  if(s==='pending')return '<span class="tag t-pend">⏳ بانتظار الاعتماد</span>';
  if(s==='processing')return '<span class="tag t-proc">⚙️ قيد التنفيذ</span>'+(overdue?' <span class="tag t-rej">متأخرة</span>':'');
  if(s==='completed')return '<span class="tag t-appr">✔ منجزة ومُعادة للموظف</span>';
  if(s==='rejected')return '<span class="tag t-rej">✕ مرفوضة</span>';
  return '<span class="tag t-canc">ملغاة</span>';
}
const isOverdue=r=>r.status==='processing'&&r.dueAt&&daysLeft(r.dueAt)<0;
function stageLabel(r){
  if(r.status==='completed')return 'مكتملة';
  if(r.status==='rejected')return 'متوقفة';
  if(r.status==='cancelled')return 'ملغاة';
  const st=r.chain[r.step]; return st? (st.role==='exec'?'قسم الموارد البشرية (تنفيذ)':'لدى '+STEP_NAME[st.role]):'—';
}

function runAlerts(){
  const s=DB.settings, t=today(); let n=0;
  const once=(key,to,title,msg)=>{ const k=key+'|'+t; if(DB.alerted[k])return; DB.alerted[k]=1; notify(to,title,msg); n++; };
  DB.employees.filter(e=>e.active).forEach(e=>{
    if(e.contractEnd){const d=daysLeft(e.contractEnd);
      if(d<=s.alertContract&&d>=-30&&!e.contractDecision){
        once('c'+e.id,'role:hr_staff','عقد يقترب من الانتهاء','عقد الموظف '+e.name+' ('+e.id+') ينتهي في '+fmt(e.contractEnd)+' – متبقٍ '+d+' يوماً. هل يُجدد؟');
        const bm=branchMgr(e.branch); if(bm) once('cb'+e.id,bm.id,'عقد موظف في فرعك ينتهي قريباً',e.name+' ينتهي عقده في '+fmt(e.contractEnd)+'. يرجى إفادتنا بالرغبة في التجديد من عدمه.');
        once('ce'+e.id,e.id,'عقدك يقترب من الانتهاء','ينتهي عقدك في '+fmt(e.contractEnd)+'. قدّم طلب تجديد العقد وحدد رغبتك.');
      }}
    if(e.iqamaExpiry&&daysLeft(e.iqamaExpiry)<=s.alertIqama&&daysLeft(e.iqamaExpiry)>=-60)
      once('i'+e.id,'role:hr_staff','إقامة تقترب من الانتهاء','إقامة '+e.name+' ('+e.id+') تنتهي في '+fmt(e.iqamaExpiry)+'.');
    if(e.insurance&&e.insurance.expiry&&daysLeft(e.insurance.expiry)<=s.alertIns&&daysLeft(e.insurance.expiry)>=-30){
      once('n'+e.id,'role:hr_staff','تأمين طبي يقترب من الانتهاء','وثيقة تأمين '+e.name+' تنتهي في '+fmt(e.insurance.expiry)+'.');
      once('ne'+e.id,e.id,'تأمينك الطبي يقترب من الانتهاء','تنتهي وثيقة تأمينك الطبي في '+fmt(e.insurance.expiry)+'. قسم الموارد البشرية يتولى التجديد.');
    }
  });
  (DB.vehicles||[]).forEach(v=>{ vehAlerts(v).forEach(a=>{
    once('v'+v.id+a.l,'role:hr_staff','وثيقة مركبة تقترب من الانتهاء',a.l+' للمركبة '+v.plate+' تنتهي في '+fmt(a.d)+' ('+a.n+' يوماً). التجديد عبر منصة تم.');
  });});
  DB.employees.filter(e=>e.active&&e.driverCard&&e.driverCard.expiry).forEach(e=>{
    const n=daysLeft(e.driverCard.expiry);
    if(n<=60&&n>=-30) once('dc'+e.id,'role:hr_staff','بطاقة سائق تقترب من الانتهاء','بطاقة '+e.name+' تنتهي في '+fmt(e.driverCard.expiry)+'. التجديد عبر منصة لوجستي.');
  });
  (DB.gov||[]).forEach(g=>{ if(!g.expiry) return; const n=daysLeft(g.expiry);
    if(n<=60&&n>=-30) once('gv'+g.id,'role:hr','اشتراك منصة يقترب من الانتهاء',g.platform+' ينتهي في '+fmt(g.expiry)+'.');
  });
  DB.docs.forEach(d=>{const dd=daysLeft(d.expiry);
    if(dd<=s.alertDoc&&dd>=-60){
      once('d'+d.id,'role:hr_staff','وثيقة منشأة تقترب من الانتهاء',d.type+' – '+brName(d.branch)+' ينتهي في '+fmt(d.expiry)+' ('+dd+' يوماً).');
      once('dh'+d.id,'role:hr','تنبيه انتهاء وثيقة',d.type+' لـ'+brName(d.branch)+' ينتهي في '+fmt(d.expiry)+'.');
    }});
  (DB.tasks||[]).forEach(t=>{
    if(t.status!=='open'||!t.due) return;
    const d=daysLeft(t.due), who=(emp(t.assignee)||{name:t.assignee}).name;
    const lastB=(t.blockers||[]).slice(-1)[0];
    if(d<0){
      once('tk'+t.id,'role:hr','مهمة متأخرة لم تُنجز','«'+t.title+'» — '+who+' • متأخرة '+(-d)+' يوم'+
        (lastB?' • العائق المُبلّغ: '+lastB.type+' — '+lastB.detail:' • لم يُسجَّل سبب للتأخير بعد'));
      once('tka'+t.id,t.assignee,'تذكير: مهمة متأخرة','«'+t.title+'» متأخرة '+(-d)+' يوم. أنجزها أو أبلغ عن العائق.');
      if(t.by&&t.by!=='role:hr') once('tkb'+t.id,t.by,'مهمة أسندتها متأخرة','«'+t.title+'» لدى '+who+' متأخرة '+(-d)+' يوم.');
    } else if(d<=1){
      once('tkd'+t.id,t.assignee,'تذكير: مهمة تستحق قريباً','«'+t.title+'» تستحق في '+fmt(t.due)+'.');
    }
  });
  DB.requests.filter(isOverdue).forEach(r=>{
    once('o'+r.id,'role:hr','تجاوز مدة إنجاز الإجراءات','المعاملة '+r.id+' ('+TYPES[r.type].name+') تجاوزت المدة المحددة للتنفيذ.',r.id);
  });
  if(n) save();
}

async function doLogin(){
  const u=normNum($('lu').value), p=$('lp').value.trim();
  let serverAuthenticated=false;
  if(DESKTOP_REMOTE&&SRV){
    const remoteLogin=await serverLogin(u,p);
    if(!remoteLogin.ok){
      $('loginErr').innerHTML='<div class="err">'+(remoteLogin.kind==='auth'?'بيانات الدخول غير صحيحة على سيرفر الشركة.':'السيرفر غير متاح ولا توجد نسخة محلية صالحة لهذا الحساب.')+'</div>';
      return;
    }
    serverAuthenticated=true;
    const latest=await pullDB(); if(latest) DB=latest;
  }
  const e=DB.employees.find(x=>normNum(x.id)===u||normNum(x.iqama)===u||normNum(x.mobile)===u);
  const pOk=e&&(e.pass===p||(/^[٠-٩۰-۹]+$/.test($('lp').value.trim())&&e.pass===normNum($('lp').value)));
  if(!e||!pOk){
    LOGIN_TRIES=(typeof LOGIN_TRIES==='undefined'?0:LOGIN_TRIES)+1;
    $('loginErr').innerHTML='<div class="err">رقم الهوية/الإقامة أو كلمة المرور غير صحيحة.'+
      (LOGIN_TRIES>=3?'<div style="margin-top:6px;font-size:12.5px">نسيت كلمة المرور؟ استخدم رابط الاستعادة أدناه، أو أضف <b>?reset=1</b> إلى رابط الصفحة لإعادة ضبط النسخة المحلية.</div>':'')+'</div>';
    return; }
  if(!e.active){ $('loginErr').innerHTML='<div class="err">هذا الحساب موقوف. راجع إدارة الموارد البشرية.</div>'; return; }
  if(SRV&&!serverAuthenticated){ const r=await serverLogin(u,p);
    if(!r.ok){
      if(r.kind==='auth'){
        LOGIN_TRIES=(typeof LOGIN_TRIES==='undefined'?0:LOGIN_TRIES)+1;
        $('loginErr').innerHTML='<div class="err">كلمة المرور المحفوظة على هذا الجهاز غير مطابقة لما هو مسجَّل فعلياً على السيرفر — على الأرجح غُيّرت كلمة المرور من جهاز آخر.'+
          '<div style="margin-top:6px;font-size:12.5px">استخدم «نسيت كلمة المرور؟» أدناه، أو راجع مدير الموارد البشرية لإعادة تعيينها.</div></div>';
      } else {
        $('loginErr').innerHTML='<div class="err">تعذّر الاتصال بالسيرفر: '+esc(r.message||'')+'<div style="margin-top:6px;font-size:12.5px">تحقق من اتصالك بالإنترنت وأعد المحاولة.</div></div>';
      }
      return;
    }
  }
  await loadDocs(e.id); ME=e; runAlerts(); autoDailyReport(); logLogin(e);
  VIEW=(e.role==='hr'||e.role==='hr_staff')?'hrdash':'dash'; PAGE=1; render();
}

}
function forcePass(){
  modal('🔐 تغيير كلمة المرور مطلوب',
   '<div class="note warn" style="margin-bottom:14px">هذا أول دخول لك بكلمة المرور الافتراضية. لحماية بياناتك يجب تعيين كلمة مرور خاصة بك قبل استخدام النظام.</div>'+
   '<div id="fpErr"></div>'+
   '<div class="field"><label>كلمة المرور الجديدة <span style="color:var(--red)">*</span> <span class="hint">6 خانات على الأقل</span></label><input id="fp1" type="password"></div>'+
   '<div class="field"><label>تأكيد كلمة المرور <span style="color:var(--red)">*</span></label><input id="fp2" type="password"></div>',
   '<button class="btn green" onclick="saveForcePass()">حفظ ومتابعة</button><button class="btn ghost" onclick="logout();closeModal()">تسجيل الخروج</button>',true);
}
async function saveForcePass(){
  const a=$('fp1').value, b=$('fp2').value, err=$('fpErr'), btn=document.querySelector('.modal-actions .btn.green');
  if(a.length<6){ err.innerHTML='<div class="err">كلمة المرور يجب ألا تقل عن 6 خانات.</div>'; return; }
  if(a!==b){ err.innerHTML='<div class="err">كلمتا المرور غير متطابقتين.</div>'; return; }
  if(a==='123456'||a==='12345'||a===ME.iqama||a===ME.id){ err.innerHTML='<div class="err">اختر كلمة مرور مختلفة عن الافتراضية أو رقم هويتك.</div>'; return; }
  const oldPass=ME.pass, oldMust=ME.mustChangePass, oldAt=ME.passChangedAt;
  ME.pass=a; ME.mustChangePass=false; ME.passChangedAt=new Date().toISOString();
  if(btn){ btn.disabled=true; btn.textContent='جارٍ الحفظ…'; }
  err.innerHTML='';
  let ok=false;
  try{ ok = await save(); }catch(e){ ok=false; }
  if(!ok){
    ME.pass=oldPass; ME.mustChangePass=oldMust; ME.passChangedAt=oldAt;
    if(btn){ btn.disabled=false; btn.textContent='حفظ ومتابعة'; }
    err.innerHTML='<div class="err">تعذّر حفظ كلمة المرور على السيرفر — لم تُطبَّق أي تغييرات. تحقق من الاتصال وأعد المحاولة.</div>';
    return;
  }
  closeModal(); toast('حُفظت كلمة المرور الجديدة بنجاح على السيرفر'); render();
}
function logLogin(u){
  const now=new Date().toISOString();
  u.lastLogin=now;
  DB.logins=DB.logins||[];
  DB.logins.push({id:u.id,name:u.name,role:u.role,at:now});
  if(DB.logins.length>400) DB.logins=DB.logins.slice(-400);
  if(u.role==='hr_staff') notify('role:hr','دخول موظف الموارد البشرية',u.name+' ('+u.id+') سجّل الدخول إلى النظام '+fmtT(now)+'.');
  save();
  setTimeout(()=>taskGreeting(u),400);
}
function taskGreeting(u){
  const tk=(DB.tasks||[]).filter(t=>t.assignee===u.id&&t.status==='open');
  const late=tk.filter(taskLate);
  const asg=DB.requests.filter(r=>r.status==='processing'&&r.assignee===u.id);
  const docs=(DB.docs||[]).filter(d=>d.assignee===u.id&&!d.receivedAt);
  const pend=pendingFor(u).length;
  if(!tk.length&&!asg.length&&!docs.length&&!pend) return;
  const row=(t)=>'<div style="display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line)">'+
    '<span>'+(taskLate(t)?'🔴':'🟡')+'</span><div style="flex:1"><b style="font-size:13.5px">'+esc(t.title)+'</b>'+
    '<div class="mini">استحقاق '+fmt(t.due)+(taskLate(t)?' — متأخرة '+(-daysLeft(t.due))+' يوم':'')+'</div></div>'+
    '<button class="btn sm green" onclick="closeModal();doneTask(\''+t.id+'\')">إنجاز</button></div>';

function fillAssignees(){
  const b=$('tk_br').value, d=$('tk_dp').value;
  const list=DB.employees.filter(e=>e.active&&(!b||e.branch===b)&&(!d||e.dept===d)).slice(0,300);
  $('tk_a').innerHTML=list.length?list.map(e=>'<option value="'+e.id+'">'+esc(e.name)+' – '+esc(e.title)+' ('+e.id+')</option>').join(''):'<option value="">لا يوجد</option>';
}
function saveTask(id){
  const title=$('tk_t').value.trim(), a=$('tk_a').value;
  if(!title||!a){ toast('اكتب عنوان المهمة واختر الموظف المكلّف'); return; }
  if(id){ const t=DB.tasks.find(x=>x.id===id); Object.assign(t,{title,desc:$('tk_d').value.trim(),assignee:a,due:$('tk_du').value,priority:$('tk_p').value}); }
  else{ const t={id:'TSK-'+(++DB.seq.t),title,desc:$('tk_d').value.trim(),assignee:a,due:$('tk_du').value,priority:$('tk_p').value,
      status:'open',by:ME.id,byName:ME.name,createdAt:new Date().toISOString(),doneAt:null};
    DB.tasks.push(t); notify(a,'مهمة جديدة مسندة إليك',title+' — تاريخ الاستحقاق '+fmt(t.due)+' بواسطة '+ME.name+'.'); }
  save(); closeModal(); toast('حُفظت المهمة'); render();
}
const DELAY_REASONS=['نقص معلومات أو مستندات','انتظار جهة خارجية','انتظار موافقة داخلية','ضغط أعمال','مشكلة تقنية في النظام','غياب أو إجازة','عدم وضوح المطلوب','أخرى'];
const BLOCK_TYPES=['نقص مستندات من الموظف','تأخر جهة حكومية','تأخر بنك أو مورد','عطل تقني','حاجة إلى موافقة مدير','نقص صلاحية','أخرى'];
const ISSUE_TYPES=['خطأ في التنفيذ','معلومات ناقصة','عدم اتباع الإجراء','تكرار العمل','تأخير غير مبرر','جودة عمل ضعيفة'];
function taskHours(t){ if(!t.doneAt) return null; return Math.max(0,(new Date(t.doneAt)-new Date(t.createdAt))/3600000); }
function fmtDur(h){
  if(h==null) return '—';
  if(h<1) return Math.round(h*60)+' دقيقة';
  if(h<24) return (Math.round(h*10)/10)+' ساعة';
  const d=Math.floor(h/24), r=Math.round(h%24);
  return d+' يوم'+(r?' و'+r+' ساعة':'');
}
function doneTask(id){
  const t=DB.tasks.find(x=>x.id===id); if(!t) return;
  const late=t.due&&daysLeft(t.due)<0, ld=late?-daysLeft(t.due):0;
  modal('✅ تسجيل إنجاز المهمة',
   '<div class="note'+(late?' warn':' ok')+'" style="margin-bottom:14px"><b>'+esc(t.title)+'</b><div class="mini" style="color:inherit">'+
    'أُسندت في '+fmt(t.createdAt)+' • تاريخ الاستحقاق '+fmt(t.due)+
    (late?' • <b>متأخرة '+ld+' يوم</b>':' • ضمن الوقت المحدد')+'</div></div>'+
   '<div id="dnErr"></div>'+
   '<div class="field"><label>ملاحظة الإنجاز / ما تم عمله</label><textarea id="dn_note"></textarea></div>'+
   (late?'<div class="row-2"><div class="field"><label>سبب التأخير <span style="color:var(--red)">*</span></label>'+
     '<select id="dn_r"><option value="">— اختر —</option>'+DELAY_REASONS.map(x=>'<option>'+x+'</option>').join('')+'</select></div>'+
     '<div class="field"><label>العائق الذي منع الإنجاز في وقته <span style="color:var(--red)">*</span></label>'+
     '<select id="dn_b"><option value="">— اختر —</option>'+BLOCK_TYPES.map(x=>'<option>'+x+'</option>').join('')+'</select></div>'+
     '<div class="field" style="grid-column:1/-1"><label>تفاصيل التأخير <span style="color:var(--red)">*</span></label><textarea id="dn_d"></textarea></div></div>':''),
   '<button class="btn green" onclick="saveDone(\''+id+'\')">تأكيد الإنجاز</button><button class="btn ghost" onclick="closeModal()">إلغاء</button>');
}
function saveDone(id){
  const t=DB.tasks.find(x=>x.id===id), late=t.due&&daysLeft(t.due)<0;
  if(late){
    const r=$('dn_r').value, b=$('dn_b').value, d=$('dn_d').value.trim();
    if(!r||!b||d.length<10){ $('dnErr').innerHTML='<div class="err">المهمة متأخرة — يجب اختيار سبب التأخير والعائق وكتابة تفاصيل واضحة (10 أحرف على الأقل).</div>'; return; }
    t.delayReason=r; t.blocker=b; t.delayNote=d; t.lateDays=-daysLeft(t.due);
  }
  t.status='done'; t.doneAt=new Date().toISOString(); t.doneBy=ME.name; t.doneNote=$('dn_note').value.trim();
  t.hours=taskHours(t);
  const dur=fmtDur(t.hours);
  addAchv(t.assignee,'إنجاز مهمة','أنجز المهمة: '+t.title+' — استغرقت '+dur+
    (late?' • متأخرة '+t.lateDays+' يوم — السبب: '+t.delayReason+' • العائق: '+t.blocker:' • ضمن الوقت المحدد'),null);
  notify(t.by,'إنجاز مهمة',(emp(t.assignee)||{name:''}).name+' أنجز المهمة: '+t.title+' خلال '+dur+
    (late?' (متأخرة '+t.lateDays+' يوم — '+t.delayReason+')':''));
  if(late) notify('role:hr','مهمة أُنجزت متأخرة',t.title+' — '+(emp(t.assignee)||{name:''}).name+' • تأخير '+t.lateDays+' يوم • السبب: '+t.delayReason+' • العائق: '+t.blocker);
  save(); closeModal(); toast('سُجّل الإنجاز خلال '+dur); render();
}

  modal('⚠️ الإبلاغ عن عائق في المهمة',

   '<div class="field"><label>هل يحتاج تدخل مدير الموارد البشرية؟</label><select id="bk_n"><option value="1">نعم</option><option value="0">لا</option></select></div>'+
   '<div class="field" style="grid-column:1/-1"><label>تفاصيل العائق *</label><textarea id="bk_d"></textarea></div>'+
   '<div class="field"><label>تاريخ استحقاق مقترح جديد</label><input id="bk_due" type="date" value="'+(t.due||'')+'"></div></div>',
   '<button class="btn gold" onclick="saveBlock(\''+id+'\')">إرسال البلاغ</button><button class="btn ghost" onclick="closeModal()">إلغاء</button>');
}
function saveBlock(id){
  const t=DB.tasks.find(x=>x.id===id), d=$('bk_d').value.trim();
  if(d.length<10){ $('bkErr').innerHTML='<div class="err">اكتب تفاصيل العائق بوضوح (10 أحرف على الأقل).</div>'; return; }
  t.blockers=t.blockers||[];
  t.blockers.push({type:$('bk_t').value,detail:d,needHR:$('bk_n').value==='1',suggested:$('bk_due').value,at:new Date().toISOString(),by:ME.name});
  t.blocker=$('bk_t').value;
  notify('role:hr','عائق في مهمة',t.title+' — '+ME.name+' • العائق: '+t.blocker+' • '+d);
  if(t.by&&t.by!==ME.id) notify(t.by,'عائق في مهمة أسندتها',t.title+' — '+ME.name+': '+d);
  save(); closeModal(); toast('أُبلغ مدير الموارد البشرية بالعائق'); render();
}
function addIssue(id){
  const t=DB.tasks.find(x=>x.id===id);
  modal('⛔ تسجيل خطأ أو ملاحظة على المهمة',
   '<div class="note bad" style="margin-bottom:14px"><b>'+esc(t.title)+'</b> — '+esc((emp(t.assignee)||{name:''}).name)+'</div><div id="isErr"></div>'+
   '<div class="field"><label>نوع الخطأ *</label><select id="is_t">'+ISSUE_TYPES.map(x=>'<option>'+x+'</option>').join('')+'</select></div>'+
   '<div class="field"><label>التفاصيل *</label><textarea id="is_d"></textarea></div>'+
   '<div class="field"><label>هل تُعاد المهمة للتنفيذ؟</label><select id="is_r"><option value="1">نعم — إعادة فتحها</option><option value="0">لا</option></select></div>',
   '<button class="btn red" onclick="saveIssue(\''+id+'\')">تسجيل الخطأ</button><button class="btn ghost" onclick="closeModal()">إلغاء</button>');
}
function saveIssue(id){
  const t=DB.tasks.find(x=>x.id===id), d=$('is_d').value.trim();
  if(d.length<5){ $('isErr').innerHTML='<div class="err">اكتب تفاصيل الخطأ.</div>'; return; }
  t.issues=t.issues||[];
  t.issues.push({type:$('is_t').value,detail:d,at:new Date().toISOString(),by:ME.name});
  const e=emp(t.assignee);
  if(e){ e.notes=e.notes||[]; e.notes.push({type:'ملاحظة على مهمة — '+$('is_t').value,text:t.title+': '+d,by:ME.name,at:new Date().toISOString()}); }
  if($('is_r').value==='1'){ t.status='open'; t.doneAt=null; t.hours=null; }
  notify(t.assignee,'ملاحظة على مهمتك',$('is_t').value+' في المهمة «'+t.title+'»: '+d+($('is_r').value==='1'?' — أُعيد فتح المهمة.':''));
  save(); closeModal(); toast('سُجّل الخطأ في ملف الموظف'); render();
}
function delTask(id){
  if(!can('deleteTask')){ toast('حذف المهام من صلاحية مدير الموارد البشرية فقط'); return; }
  if(!confirm('حذف المهمة نهائياً من سجل الموظف؟'))return;
  DB.tasks=DB.tasks.filter(x=>x.id!==id); save(); toast('حُذفت المهمة'); render();
}
function delAchv(empId,aid){
  if(!can('deleteAchv')){ toast('سجل الإنجازات لا يُحذف إلا بواسطة مدير الموارد البشرية'); return; }
  if(!confirm('حذف هذا الإنجاز من السجل الدائم؟')) return;
  const e=emp(empId); e.achievements=(e.achievements||[]).filter(a=>a.id!==aid);
  save(); toast('حُذف من السجل'); render();
}
function addAchvManual(id){
  modal('🏅 إضافة إنجاز إلى السجل الدائم',

}

/* ---------- نموذج الطلب ---------- */
function openForm(tk){
  if(!canUse(tk)){ toast('هذه الخدمة غير متاحة لصلاحيتك'); return; }
  FILES={};
  const t=TYPES[tk], c=effChain(ME,tk);
  const route=c.map((x,i)=>'<span class="tag t-info">'+(i+1)+'. '+STEP_NAME[x]+'</span>').join(' ');
  let pre='';
  if(tk==='contract') pre='<div class="note warn" style="margin-bottom:14px">ينتهي عقدك الحالي في <b class="num">'+fmt(ME.contractEnd)+'</b>.</div>';
  if(t.needFile) pre+='<div class="note bad" style="margin-bottom:14px">⚠️ لا يُقبل الطلب دون إرفاق '+esc(t.needFile)+'.</div>';
  modal(t.icon+' '+t.name,

  if(tk==='leave'){ const d=$('f_days'),f=$('f_from'),to=$('f_to');

function fieldHtml(f){
  const id='f_'+f.k, req=f.req?' <span style="color:var(--red)">*</span>':'';
  let inp='';
  if(f.t==='select') inp='<select id="'+id+'"><option value="">— اختر —</option>'+f.o.map(o=>'<option>'+esc(o)+'</option>').join('')+'</select>';
  else if(f.t==='textarea') inp='<textarea id="'+id+'"></textarea>';
  else if(f.t==='auto') inp='<input id="'+id+'" type="date" readonly style="background:#F1F5F9">';
  else if(f.t==='file') inp='<label class="upl" id="lbl_'+id+'">اضغط لإرفاق صور أو ملفات (PDF / Word / Excel) — يمكن اختيار أكثر من ملف'+
    '<input id="'+id+'" type="file" multiple accept="image/*,.pdf,.doc,.docx,.xls,.xlsx" style="display:none" onchange="pickFile(this,\''+f.k+'\')"></label>';
  else inp='<input id="'+id+'" type="'+(f.t==='date'?'date':f.t==='number'?'number':'text')+'">';
  const wide=(f.t==='textarea'||f.t==='file')?' style="grid-column:1/-1"':'';

function readAsData(f){ return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f);}); }
async function pickFile(input,key){
  const fs=Array.from(input.files||[]); if(!fs.length) return;
  FILES.list=FILES.list||[];
  for(const f of fs){
    if(FILES.list.length>=6){ toast('الحد الأقصى 6 مرفقات للطلب الواحد'); break; }
    try{
      if(f.type.startsWith('image/')){ FILES.list.push({name:f.name,type:'image',data:await compress(f,1100,.7)}); }
      else{
        if(f.size>4*1024*1024){ toast('حجم «'+f.name+'» يتجاوز 4 ميجابايت'); continue; }
        FILES.list.push({name:f.name,type:f.type||'file',data:await readAsData(f)});
      }
    }catch(e){ toast('تعذر قراءة الملف '+f.name); }
  }
  renderPicked(key);
}
function renderPicked(key){
  const L=FILES.list||[];
  $('lbl_f_'+key).innerHTML=(L.length? '<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:8px">'+
    L.map((x,i)=>x.type==='image'?'<img src="'+x.data+'" style="height:70px;border-radius:8px">'
      :'<span class="tag t-info">📄 '+esc(x.name)+'</span>').join('')+'</div>'+
    '<b>'+L.length+' مرفق</b> — اضغط لإضافة المزيد':'اضغط لإرفاق صور أو ملفات (PDF / Word / Excel) — يمكن اختيار أكثر من ملف')+
    '<input id="f_'+key+'" type="file" multiple accept="image/*,.pdf,.doc,.docx,.xls,.xlsx" style="display:none" onchange="pickFile(this,\''+key+'\')">';
}
async function submitForm(tk){
  const t=TYPES[tk], p={}, miss=[];
  for(const f of t.fields){
    if(f.t==='file'){ if(f.req&&!(FILES.list&&FILES.list.length)) miss.push(f.l); continue; }
    const el=$('f_'+f.k), v=el?el.value.trim():'';
    if(f.req&&!v) miss.push(f.l); p[f.k]=v;
  }
  if(tk==='leave'){
    if(+p.days<=0) miss.push('عدد أيام صحيح');
    if(p.leaveType==='سنوية'&&+p.days>ME.leaveBalance) miss.push('عدد الأيام يتجاوز رصيدك ('+ME.leaveBalance+' يوماً)');
  }
  if(miss.length){ $('formErr').innerHTML='<div class="err">أكمل ما يلي: '+esc(miss.join('، '))+'</div>'; return; }
  const r=newReq(ME,tk,p);
  if(FILES.list&&FILES.list.length){ r.hasFile=true; r.files=FILES.list.map(x=>({name:x.name,type:x.type}));
    await S.set('hrsys:att:'+r.id,FILES.list); }
  submitReq(r); await save(); closeModal(); toast('أُرسل الطلب برقم '+r.id); go('req',r.id);
}

function adminSkip(rid){
  const r=DB.requests.find(x=>x.id===rid), now=new Date().toISOString();
  while(r.step<r.chain.length&&r.chain[r.step].role!=='exec'){
    const st=r.chain[r.step]; st.status='approve'; st.byName=ME.name; st.by=ME.id; st.at=now;
    r.history.push({role:st.role,byName:ME.name,byRole:'hr',act:'approve',note:'اعتماد مباشر من مدير الموارد البشرية',at:now});
    r.step++;
  }
  if(r.step>=r.chain.length){ r.status='completed'; r.completedAt=now; applyEffects(r); }
  else { r.status='processing'; r.dueAt=addD(today(),slaFor(r.type)); notifyCurrentStep(r); }
  notify(r.empId,'تحديث على معاملتك','اعتمد مدير الموارد البشرية معاملتك '+r.id+' مباشرة.',r.id);
  save(); toast('اعتُمدت المعاملة مباشرة'); render();
}
function adminMove(rid){
  const r=DB.requests.find(x=>x.id===rid);
  modal('↪️ تحويل المعاملة إلى مرحلة أخرى',
   '<div class="field"><label>المرحلة</label><select id="mv_s">'+r.chain.map((c,i)=>'<option value="'+i+'"'+(i===r.step?' selected':'')+'>'+(i+1)+'. '+STEP_NAME[c.role]+'</option>').join('')+'</select></div>'+
   '<div class="field"><label>سبب التحويل</label><textarea id="mv_n"></textarea></div>',
   '<button class="btn green" onclick="saveMove(\''+rid+'\')">تحويل</button><button class="btn ghost" onclick="closeModal()">إلغاء</button>');
}
function saveMove(rid){
  const r=DB.requests.find(x=>x.id===rid), i=+$('mv_s').value, n=$('mv_n').value.trim();
  r.step=i; r.chain.forEach((c,j)=>{ if(j>=i){ c.status='wait'; c.byName=null; c.at=null; } });
  r.status=r.chain[i].role==='exec'?'processing':'pending';
  if(r.status==='processing') r.dueAt=addD(today(),slaFor(r.type));
  r.history.push({role:r.chain[i].role,byName:ME.name,byRole:'hr',act:'approve',note:'تحويل المعاملة إلى '+STEP_NAME[r.chain[i].role]+(n?' — '+n:''),at:new Date().toISOString()});
  notifyCurrentStep(r); notify(r.empId,'تحويل معاملتك','حُوّلت معاملتك '+r.id+' إلى '+STEP_NAME[r.chain[i].role]+'.',r.id);
  save(); closeModal(); toast('حُوّلت المعاملة'); render();
}
function adminReopen(rid){

function doAct(id,a){
  const r=DB.requests.find(x=>x.id===id), t=TYPES[r.type], n=$('actNote').value.trim();
  const showErr=m=>{ const b=$('actErr'); if(b) b.innerHTML='<div class="err">'+m+'</div>'; toast(m); const ta=$('actNote'); if(ta&&ta.focus) ta.focus(); };
  if(a==='reject'){
    if(!n){ showErr('لا يمكن رفض الطلب دون كتابة سبب الرفض.'); return; }
    if(n.length<10){ showErr('سبب الرفض قصير جداً — اكتب سبباً واضحاً (10 أحرف على الأقل).'); return; }
  }
  if(r.type==='inquiry'&&a==='approve'&&!n){ showErr('اكتب نص الرد على الاستفسار.'); return; }
  let ex=null;
  if(r.chain[r.step].role==='exec'){
    ex={}; const miss=[];
    (t.execFields||[]).forEach(f=>{const el=$('x_'+f.k), v=el?el.value.trim():''; if(f.req&&!v)miss.push(f.l); ex[f.k]=v;});
    if(miss.length){ toast('أكمل: '+miss.join('، ')); return; }
  }
  act(id,a,n,ex);
}

/* ---------- لوحة الموارد البشرية ---------- */
function weekAtt(){
  const labels=[], pres=[], abs=[];
  for(let k=6;k>=0;k--){
    const d=addD(today(),-k), c=attCounts(d);
    labels.push(WDAYS[new Date(d).getDay()]);
    pres.push(c.present+c.late); abs.push(c.absent);
  }
  return {labels,pres,abs};
}

function canSeeFile(e){
  if(!e) return false;
  if(ME.role==='hr'||ME.role==='hr_staff'||ME.role==='gm') return true;
  if(ME.id===e.id) return true;
  if(ME.role==='branch'||ME.role==='hr_branch') return e.branch===ME.branch;
  if(ME.role==='manager') return e.managerId===ME.id;
  return false;
}

/* ---------- الأرشيف ---------- */
function snapOf(e){ return {id:e.id,name:e.name,branch:e.branch,dept:e.dept,title:e.title,nationality:e.nationality}; }
function archiveEmp(id,reason){
  const e=emp(id); if(!e) return;
  if(!reason&&!confirm('نقل الموظف '+e.name+' ومعاملاته إلى الأرشيف؟ يمكن استعادته لاحقاً.')) return;
  const rs=DB.requests.filter(r=>r.empId===id);
  rs.forEach(r=>{ r.empSnap=snapOf(e); r.archivedAt=new Date().toISOString(); r.archivedBy=ME?ME.name:'النظام'; });
  DB.archive.employees.push(Object.assign({},e,{archivedAt:new Date().toISOString(),archivedBy:ME?ME.name:'النظام',archiveReason:reason||e.endReason||'أرشفة إدارية'}));
  DB.archive.requests=DB.archive.requests.concat(rs);
  const chats=(DB.chats||[]).filter(c=>c.a===id||c.b===id);
  chats.forEach(c=>{ c.snap=chatSnap(c); c.archivedAt=new Date().toISOString(); c.archivedBy=ME?ME.name:'النظام'; DB.archive.chats.push(c); });
  DB.chats=(DB.chats||[]).filter(c=>c.a!==id&&c.b!==id);
  DB.employees=DB.employees.filter(x=>x.id!==id);
  DB.requests=DB.requests.filter(r=>r.empId!==id);
  save(); toast('نُقل الموظف ومعاملاته ومحادثاته إلى الأرشيف'); go('archive');
}
function restoreEmp(id){
  const i=DB.archive.employees.findIndex(x=>x.id===id); if(i<0) return;
  const e=DB.archive.employees.splice(i,1)[0];
  delete e.archivedAt; delete e.archivedBy; delete e.archiveReason;
  DB.employees.push(e);
  const back=DB.archive.requests.filter(r=>r.empId===id);
  back.forEach(r=>{delete r.archivedAt;delete r.archivedBy;});
  DB.requests=DB.requests.concat(back);
  DB.archive.requests=DB.archive.requests.filter(r=>r.empId!==id);
  save(); toast('استُعيد الموظف وسجله'); render();
}
function purgeEmp(id){
  if(!confirm('حذف نهائي لا يمكن التراجع عنه. متابعة؟')) return;
  DB.archive.employees=DB.archive.employees.filter(x=>x.id!==id);
  DB.archive.requests=DB.archive.requests.filter(r=>r.empId!==id);
  save(); toast('حُذف السجل نهائياً'); render();
}
function archiveReq(rid){
  const i=DB.requests.findIndex(r=>r.id===rid); if(i<0) return;
  const r=DB.requests.splice(i,1)[0], e=emp(r.empId);
  r.empSnap=e?snapOf(e):(r.empSnap||{name:'—',id:r.empId});
  r.archivedAt=new Date().toISOString(); r.archivedBy=ME.name;
  DB.archive.requests.push(r); save(); toast('نُقلت المعاملة إلى الأرشيف'); go('archive');
}
function archiveClosed(){
  const days=+($('ar_days')?$('ar_days').value:90)||90, cut=addD(today(),-days);
  const move=DB.requests.filter(r=>(r.status==='completed'||r.status==='rejected'||r.status==='cancelled')&&(r.completedAt||r.createdAt).slice(0,10)<=cut);
  if(!move.length){ toast('لا توجد معاملات منتهية أقدم من '+days+' يوم'); return; }
  move.forEach(r=>{const e=emp(r.empId); r.empSnap=e?snapOf(e):(r.empSnap||{name:'—',id:r.empId}); r.archivedAt=new Date().toISOString(); r.archivedBy=ME.name;});
  DB.archive.requests=DB.archive.requests.concat(move);
  DB.requests=DB.requests.filter(r=>move.indexOf(r)<0);
  save(); closeModal(); toast('أُرشفت '+move.length+' معاملة'); render();
}

function reqManualReset(e,via){
  const r={id:'RS-'+Date.now().toString(36),empId:e.id,code:genCode(),via:via||'manual',
    at:new Date().toISOString(),exp:new Date(Date.now()+30*60000).toISOString(),status:'pending',tries:0};
  DB.resets=DB.resets||[]; DB.resets.push(r);
  notify('role:hr','طلب استعادة كلمة مرور',e.name+' ('+e.id+') طلب استعادة كلمة المرور'+(via==='mobile'?' عبر الجوال':'')+'. افتح شاشة «استعادة كلمات المرور» لإرسال الرمز.');
  notify('role:hr_staff','طلب استعادة كلمة مرور',e.name+' ('+e.id+') يحتاج رمز استعادة.');
  save(); return r;
}

function verifyReset(id){
  const who=id||($('cd_who')?$('cd_who').value.trim():'');
  const e=DB.employees.find(x=>x.id===who||String(x.iqama||'').trim()===who);
  const err=m=>{ const b=$('cdErr'); if(b) b.innerHTML='<div class="err">'+m+'</div>'; else toast(m); };
  if(!e){ err('رقم الهوية غير صحيح.'); return; }
  const code=$('cd_code').value.trim(), p1=$('cd_p1').value, p2=$('cd_p2').value;
  const r=(DB.resets||[]).filter(x=>x.empId===e.id&&x.status!=='used').slice(-1)[0];
  if(!r){ err('لا يوجد طلب استعادة. اضغط «نسيت كلمة المرور؟» أولاً.'); return; }
  if(new Date(r.exp)<new Date()){ r.status='expired'; save(); err('انتهت صلاحية الرمز. اطلب رمزاً جديداً.'); return; }
  if(r.tries>=5){ err('تجاوزت عدد المحاولات. اطلب رمزاً جديداً.'); return; }
  if(code!==r.code){ r.tries=(r.tries||0)+1; save(); err('الرمز غير صحيح. المحاولات المتبقية: '+(5-r.tries)); return; }
  if(p1.length<6){ err('كلمة المرور يجب ألا تقل عن 6 خانات.'); return; }
  if(p1!==p2){ err('كلمتا المرور غير متطابقتين.'); return; }
  if(p1==='123456'||p1==='12345'||p1===e.iqama||p1===e.id){ err('اختر كلمة مرور مختلفة عن الافتراضية أو رقم هويتك.'); return; }
  e.pass=p1; e.mustChangePass=false; e.passChangedAt=new Date().toISOString();
  r.status='used'; r.usedAt=e.passChangedAt;
  notify('role:hr','تغيير كلمة مرور',e.name+' ('+e.id+') غيّر كلمة مروره عبر رمز الاستعادة.');
  save(); closeModal(); toast('تم تغيير كلمة المرور — سجّل الدخول الآن');
  render();
}

  const emps=DB.employees.filter(e=>e.active&&e.branch===b);
  const ids=emps.map(e=>e.id);
  const day=FILTER.day||today();
  const c={present:0,late:0,absent:0,leave:0}; emps.forEach(e=>c[attStatus(e.id,day)]++);
  const reqs=DB.requests.filter(r=>ids.indexOf(r.empId)>=0);
  const pend=reqs.filter(r=>r.status==='pending').length;
  const lv=reqs.filter(r=>r.type==='leave'&&(r.status==='pending'||r.status==='processing'));
  const tk=(DB.tasks||[]).filter(t=>ids.indexOf(t.assignee)>=0);
  const iq=emps.filter(e=>e.iqamaExpiry&&daysLeft(e.iqamaExpiry)<=DB.settings.alertIqama).length;
  const ct=emps.filter(e=>e.contractEnd&&daysLeft(e.contractEnd)<=DB.settings.alertContract).length;
  const dc=DB.docs.filter(d=>d.branch===b&&daysLeft(d.expiry)<=DB.settings.alertDoc).length;
  const rate=emps.length?Math.round((c.present+c.late)/emps.length*100):0;
  const w=(function(){const L=[],P=[],A=[];
    for(let k=6;k>=0;k--){const d=addD(today(),-k);let p=0,a=0;
      emps.forEach(e=>{const st=attStatus(e.id,d); if(st==='present'||st==='late')p++; else if(st==='absent')a++;});
      L.push(WDAYS[new Date(d).getDay()]);P.push(p);A.push(a);}

  const shifts={}; emps.forEach(e=>{const sh=e.shift||'غير محدد'; shifts[sh]=(shifts[sh]||0)+1;});
  const picker=(ME.role==='branch'||ME.role==='hr_branch')?'':'<select onchange="FILTER.b=this.value;render()">'+BRANCHES.map(x=>'<option value="'+x.id+'"'+(b===x.id?' selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select>';

   statCard('i-green','✅',c.present,'الحاضرون','',"")+
   statCard('i-amber','🕐',c.late,'المتأخرون','',"")+
   statCard('i-red','🚫',c.absent,'الغائبون','',"")+
   statCard('i-violet','🏖️',c.leave,'في إجازة','',"")+'</div>'+
  '<div class="grid" style="grid-template-columns:1.2fr .8fr;gap:16px;margin-bottom:18px">'+
   '<div class="card"><div class="hd"><h3>حضور الفرع خلال الأسبوع</h3></div><div class="bd">'+
    lineChart([{name:'حاضر',color:'#12855F',data:w.P},{name:'غائب',color:'#D2434F',data:w.A}],w.L)+'</div></div>'+
   '<div class="card"><div class="hd"><h3>نسبة الحضور اليوم</h3></div><div class="bd">'+
    donut([{name:'حاضر',v:c.present,color:'#12855F',unit:'موظف'},{name:'متأخر',v:c.late,color:'#9A6B10',unit:'موظف'},
           {name:'غائب',v:c.absent,color:'#D2434F',unit:'موظف'},{name:'إجازة',v:c.leave,color:'#2563C9',unit:'موظف'}],rate+'%','نسبة الحضور')+
    '<div class="sep"></div><h4 style="margin-bottom:8px">توزيع الشِفتات</h4>'+
    Object.entries(shifts).map(([k,v])=>'<div class="bar-row"><div class="lb">'+esc(k)+'</div><div class="bar-track"><div class="bar-fill" style="width:'+Math.round(v/Math.max(1,emps.length)*100)+'%"></div></div><div class="vl num">'+v+'</div></div>').join('')+
   '</div></div></div>'+
  '<div class="grid g4" style="margin-bottom:18px">'+
   statCard('i-amber','⏳',pend,'معاملات بانتظار الاعتماد','معاملات الفرع',"go('brreq')")+
   statCard('i-teal','✅',tk.filter(t=>t.status==='open').length,'مهام مفتوحة بالفرع','',"")+
   statCard('i-red','📑',ct,'عقود تنتهي قريباً','عقود الفرع',"go('brcontracts')")+

  '<div class="grid g2" style="align-items:start">'+
   '<div class="card"><div class="hd"><h3>سجل الحضور اليومي — '+day+'</h3></div>'+
    '<div style="overflow-x:auto"><table><thead><tr><th>الموظف</th><th>الشِفت</th><th>الحضور</th><th>الانصراف</th><th>الساعات</th><th>الحالة</th></tr></thead><tbody>'+
    emps.slice(0,100).map(e=>{const a=attOf(e.id,day),st=attStatus(e.id,day);

const EVAL_CRIT=[['quality','جودة العمل'],['commit','الالتزام والانضباط'],['team','التعاون مع الفريق'],['init','المبادرة وتحمل المسؤولية'],['skill','المهارات الفنية']];
function autoScore(id){
  const tk=(DB.tasks||[]).filter(t=>t.assignee===id);
  const done=tk.filter(t=>t.status==='done'), onTime=done.filter(t=>!t.lateDays);
  const late=tk.filter(t=>t.lateDays>0||taskLate(t)).length;
  const issues=tk.reduce((n,t)=>n+((t.issues||[]).length),0);
  const rate=tk.length?Math.round(done.length/tk.length*100):0;
  const punct=done.length?Math.round(onTime.length/done.length*100):0;
  let score=Math.round((rate*0.5+punct*0.5)/20);
  score=Math.max(1,Math.min(5,score-(issues>2?1:0)||1));
  const e=emp(id), att=(function(){ let p=0,l=0;
    for(let k=29;k>=0;k--){ const d=addD(today(),-k), st=attStatus(id,d);
      if(st==='present')p++; else if(st==='late')l++; }
    return {p,l};})();
  return {tasks:tk.length,done:done.length,onTime:onTime.length,late,issues,rate,punct,score,attP:att.p,attL:att.l};
}

/* =========== الحضور والانصراف =========== */
const WDAYS=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const nowHM=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes());};
function attDay(d){ DB.att=DB.att||{}; DB.att[d]=DB.att[d]||{}; return DB.att[d]; }
function attOf(id,d){ return (DB.att&&DB.att[d||today()]&&DB.att[d||today()][id])||null; }
function isOnLeave(id,d){
  d=d||today();
  return DB.requests.some(r=>r.empId===id&&r.type==='leave'&&(r.status==='completed'||r.status==='processing')&&
    r.payload.from&&r.payload.to&&r.payload.from<=d&&d<=r.payload.to);
}
function attStatus(id,d){
  d=d||today();
  if(isOnLeave(id,d)) return 'leave';
  const a=attOf(id,d);
  if(!a||!a.in) return 'absent';
  return a.in>(DB.settings.lateAfter||'08:15')?'late':'present';
}
function attCounts(d){
  d=d||today();
  const act=DB.employees.filter(e=>e.active);
  const c={present:0,late:0,absent:0,leave:0,total:act.length};
  act.forEach(e=>{ c[attStatus(e.id,d)]++; });
  return c;
}
function checkIn(){
  const d=attDay(today());
  if(d[ME.id]&&d[ME.id].in){ toast('سجّلت حضورك مسبقاً في '+d[ME.id].in); return; }
  d[ME.id]=Object.assign({},d[ME.id],{in:nowHM()});
  const late=d[ME.id].in>(DB.settings.lateAfter||'08:15');
  if(late) notify('role:hr_staff','تأخر في الحضور',ME.name+' سجّل حضوره '+d[ME.id].in+'.');
  save(); toast(late?'سُجّل حضورك '+d[ME.id].in+' (متأخر)':'سُجّل حضورك '+d[ME.id].in); render();
}
function checkOut(){
  const d=attDay(today());
  if(!d[ME.id]||!d[ME.id].in){ toast('سجّل حضورك أولاً'); return; }
  if(d[ME.id].out){ toast('سجّلت انصرافك مسبقاً'); return; }
  d[ME.id].out=nowHM();
  save(); toast('سُجّل انصرافك '+d[ME.id].out); render();
}
function workedH(a){
  if(!a||!a.in||!a.out) return null;
  const t=x=>(+x.slice(0,2))*60+(+x.slice(3,5));
  return Math.max(0,(t(a.out)-t(a.in))/60);
}
/* رسوم بيانية بسيطة */
function lineChart(series,labels,h){
  h=h||190; const w=520, pad=30;
  const max=Math.max(4,...series.reduce((a,s)=>a.concat(s.data),[]));
  const x=i=>pad+i*((w-pad*2)/Math.max(1,labels.length-1));
  const y=v=>h-24-(v/max)*(h-50);
  const grid=[0,.25,.5,.75,1].map(f=>'<line x1="'+pad+'" x2="'+(w-pad)+'" y1="'+y(max*f)+'" y2="'+y(max*f)+'" stroke="#EEF2F6"/>'+
    '<text x="'+(w-pad+6)+'" y="'+(y(max*f)+4)+'" font-size="10" fill="#94A3B8">'+Math.round(max*f)+'</text>').join('');
  const lines=series.map(s=>'<polyline fill="none" stroke="'+s.color+'" stroke-width="2.5" stroke-linejoin="round" points="'+
    s.data.map((v,i)=>x(i)+','+y(v)).join(' ')+'"/>'+
    s.data.map((v,i)=>'<circle cx="'+x(i)+'" cy="'+y(v)+'" r="3.5" fill="#fff" stroke="'+s.color+'" stroke-width="2"/>').join('')).join('');
  const lab=labels.map((l,i)=>'<text x="'+x(i)+'" y="'+(h-6)+'" font-size="11" fill="#64748B" text-anchor="middle">'+esc(l)+'</text>').join('');
  return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:auto;direction:ltr">'+grid+lines+lab+'</svg>'+
   '<div class="legend">'+series.map(s=>'<span><i style="background:'+s.color+'"></i>'+esc(s.name)+'</span>').join('')+'</div>';
}
function donut(parts,center,sub){

    const el='<circle cx="70" cy="70" r="'+R+'" fill="none" stroke="'+p.color+'" stroke-width="18" stroke-dasharray="'+len+' '+(C-len)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 70 70)"/>';
    off+=len; return el;}).join('');

   '<svg viewBox="0 0 140 140" style="width:150px;height:150px"><circle cx="70" cy="70" r="52" fill="none" stroke="#EEF2F6" stroke-width="18"/>'+segs+

}

/* =========== المحادثة الداخلية =========== */
function myChats(u){ return (DB.chats||[]).filter(c=>c.a===u.id||c.b===u.id); }
function chatOther(c,u){ return emp(c.a===u.id?c.b:c.a)||{name:'مستخدم محذوف',id:'—'}; }
function chatUnread(u){
  return myChats(u).filter(c=>c.status==='accepted').reduce((n,c)=>n+c.messages.filter(m=>m.from!==u.id&&!m.read).length,0)
   + myChats(u).filter(c=>c.status==='pending'&&c.b===u.id).length;
}
function findChat(a,b){ return (DB.chats||[]).find(c=>(c.a===a&&c.b===b)||(c.a===b&&c.b===a)); }
function newChat(){
  modal('💬 محادثة جديدة',
   '<div class="note" style="margin-bottom:14px">لن تبدأ المحادثة إلا بعد موافقة الطرف الآخر على الطلب.</div><div id="ncErr"></div>'+
   '<div class="row-2">'+
   '<div class="field"><label>الفرع</label><select id="nc_br" onchange="fillChatUsers()"><option value="">— اختر —</option>'+BRANCHES.map(b=>'<option value="'+b.id+'">'+esc(b.name)+'</option>').join('')+'</select></div>'+
   '<div class="field"><label>القسم</label><select id="nc_dp" onchange="fillChatUsers()"><option value="">كل الأقسام</option>'+DEPTS.map(d=>'<option>'+esc(d)+'</option>').join('')+'</select></div>'+
   '<div class="field" style="grid-column:1/-1"><label>الموظف</label><select id="nc_u"><option value="">اختر الفرع أولاً</option></select></div>'+
   '<div class="field" style="grid-column:1/-1"><label>سبب المحادثة (يظهر له في الطلب)</label><textarea id="nc_n" placeholder="مثال: استفسار بخصوص جدول التسليم"></textarea></div></div>',
   '<button class="btn green" onclick="sendChatReq()">إرسال طلب المحادثة</button><button class="btn ghost" onclick="closeModal()">إلغاء</button>');
}
function fillChatUsers(){
  const b=$('nc_br').value, d=$('nc_dp').value;
  const list=DB.employees.filter(e=>e.active&&e.id!==ME.id&&(!b||e.branch===b)&&(!d||e.dept===d)).slice(0,300);
  $('nc_u').innerHTML=list.length?list.map(e=>'<option value="'+e.id+'">'+esc(e.name)+' – '+esc(e.title)+' ('+e.id+')</option>').join(''):'<option value="">لا يوجد</option>';
}
function sendChatReq(){
  const id=$('nc_u').value, n=$('nc_n').value.trim();
  if(!id){ $('ncErr').innerHTML='<div class="err">اختر الموظف.</div>'; return; }
  const ex=findChat(ME.id,id);
  if(ex){
    if(ex.status==='accepted'){ closeModal(); FILTER.c=ex.id; VIEW='chat'; render(); return; }
    if(ex.status==='pending'){ $('ncErr').innerHTML='<div class="err">يوجد طلب معلّق مع هذا الموظف.</div>'; return; }
    if(ex.status==='rejected'){ ex.status='pending'; ex.requestedBy=ME.id; ex.requestedAt=new Date().toISOString(); ex.a=ME.id; ex.b=id; ex.note=n;
      notify(id,'طلب محادثة',ME.name+' يطلب فتح محادثة معك'+(n?': '+n:'')+'.');
      save(); closeModal(); toast('أُرسل الطلب مرة أخرى'); render(); return; }
  }
  const c={id:'CH-'+Date.now().toString(36),a:ME.id,b:id,status:'pending',requestedBy:ME.id,
    requestedAt:new Date().toISOString(),note:n,messages:[]};
  DB.chats.push(c);
  notify(id,'طلب محادثة',ME.name+' ('+ROLE_NAME[ME.role]+') يطلب فتح محادثة معك'+(n?': '+n:'')+'.');
  save(); closeModal(); toast('أُرسل طلب المحادثة، بانتظار موافقة الطرف الآخر'); render();
}
function acceptChat(id){
  const c=DB.chats.find(x=>x.id===id); if(!c||c.b!==ME.id) return;
  c.status='accepted'; c.acceptedAt=new Date().toISOString();
  notify(c.a,'قُبلت المحادثة',ME.name+' وافق على فتح المحادثة معك.');
  save(); FILTER.c=c.id; toast('بدأت المحادثة'); render();
}
function rejectChat(id){
  const c=DB.chats.find(x=>x.id===id); if(!c) return;
  c.status='rejected'; c.rejectedAt=new Date().toISOString();
  notify(c.a,'رُفض طلب المحادثة',ME.name+' لم يوافق على فتح المحادثة.');
  save(); toast('رُفض الطلب'); render();
}
function closeChat(id){
  const c=DB.chats.find(x=>x.id===id);
  if(!confirm('إنهاء المحادثة؟ يمكن طلبها من جديد لاحقاً.')) return;
  c.status='rejected'; save(); FILTER.c=null; toast('أُنهيت المحادثة'); render();
}
function chatSnap(c){ const A=emp(c.a)||{name:'—'}, B=emp(c.b)||{name:'—'};
  return {a:{id:c.a,name:A.name},b:{id:c.b,name:B.name}}; }
function archiveChat(id){
  const i=(DB.chats||[]).findIndex(x=>x.id===id); if(i<0) return;
  const c=DB.chats[i];
  if(!(c.a===ME.id||c.b===ME.id||can('chatAll'))){ toast('لا تملك صلاحية حذف هذه المحادثة'); return; }
  if(!confirm('حذف المحادثة ونقلها إلى الأرشيف؟ يبقى بإمكان مدير الموارد البشرية الاطلاع عليها.')) return;
  DB.chats.splice(i,1);
  c.snap=chatSnap(c); c.archivedAt=new Date().toISOString(); c.archivedBy=ME.name;
  DB.archive.chats.push(c);
  save(); FILTER.c=null; toast('نُقلت المحادثة إلى الأرشيف'); render();
}
function delMsg(cid,mid){
  const c=(DB.chats||[]).find(x=>x.id===cid); if(!c) return;
  const i=c.messages.findIndex(m=>m.id===mid); if(i<0) return;
  const m=c.messages[i];
  if(!(m.from===ME.id||can('chatAll'))){ toast('يمكنك حذف رسائلك فقط'); return; }
  if(!confirm('حذف الرسالة ونقلها إلى الأرشيف؟')) return;
  c.messages.splice(i,1);
  DB.archive.messages.push(Object.assign({},m,{chatId:cid,snap:chatSnap(c),archivedAt:new Date().toISOString(),archivedBy:ME.name}));
  save(); toast('حُذفت الرسالة ونُقلت إلى الأرشيف'); render();
}
function restoreChat(id){
  const i=(DB.archive.chats||[]).findIndex(x=>x.id===id); if(i<0) return;
  const c=DB.archive.chats.splice(i,1)[0];
  delete c.archivedAt; delete c.archivedBy; delete c.snap;
  DB.chats.push(c); save(); toast('استُعيدت المحادثة'); render();
}
function purgeChat(id){
  if(!can('archiveDelete')){ toast('الحذف النهائي من صلاحية مدير الموارد البشرية'); return; }
  if(!confirm('حذف نهائي لا يمكن التراجع عنه؟')) return;
  DB.archive.chats=DB.archive.chats.filter(x=>x.id!==id);
  DB.archive.messages=DB.archive.messages.filter(x=>x.chatId!==id);
  save(); toast('حُذفت نهائياً'); render();
}
function openChat(id){
  const c=DB.chats.find(x=>x.id===id);
  if(c&&c.status==='accepted') c.messages.forEach(m=>{ if(m.from!==ME.id) m.read=true; });
  FILTER.c=id; save(); render();
  setTimeout(()=>{ const el=document.getElementById('msgs'); if(el) el.scrollTop=el.scrollHeight; },60);
}
function sendMsg(id){
  const c=DB.chats.find(x=>x.id===id), inp=$('msg_in'), t=(inp.value||'').trim();
  if(!c||c.status!=='accepted') return;
  if(!t){ return; }
  if(t.length>1000){ toast('الرسالة طويلة جداً'); return; }
  c.messages.push({id:'M'+Date.now().toString(36),from:ME.id,text:t,at:new Date().toISOString(),read:false});
  const o=chatOther(c,ME);
  if(c.messages.length===1||c.messages.filter(m=>m.from===ME.id).length%5===1)
    notify(o.id,'رسالة جديدة','لديك رسالة من '+ME.name+' في المحادثة الداخلية.');
  save(); render();
  setTimeout(()=>{ const el=document.getElementById('msgs'); if(el) el.scrollTop=el.scrollHeight; },60);
}

/* =========== البريد والتقارير المرسلة =========== */
async function sendMail(to,subject,text,silent){
  if(!to){ if(!silent) toast('لم يُضبط بريد مدير الموارد البشرية'); return false; }
  if(SRV){
    try{
      const r=await fetch(SRV+'/mail.php',{method:'POST',headers:hdrs(),body:JSON.stringify({to,subject,text})});
      const j=await r.json();
      if(j&&j.ok){ if(!silent) toast(j.sent?'أُرسل البريد إلى '+to:'حُفظ البريد في صندوق الصادر بالسيرفر (SMTP غير مهيأ)'); return true; }
    }catch(e){}
  }
  if(silent) return false;
  try{ window.open('mailto:'+encodeURIComponent(to)+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(text),'_blank'); }catch(e){}
  toast('فُتح برنامج البريد لإرسال الرسالة');
  return true;
}
function buildTaskReport(day){
  day=day||today();
  const isDay=t=>t&&t.slice(0,10)===day;
  const team=hrTeamList(), L=[];
  L.push('تقرير نهاية العمل — مهام قسم الموارد البشرية');
  L.push('المنشأة: '+DB.settings.orgName+'   |   التاريخ: '+day);
  L.push('='.repeat(46));
  let dAll=0,oAll=0,lAll=0;
  team.forEach(u=>{
    const tk=(DB.tasks||[]).filter(t=>t.assignee===u.id);
    const doneToday=tk.filter(t=>t.status==='done'&&isDay(t.doneAt));
    const open=tk.filter(t=>t.status==='open');
    const late=open.filter(taskLate);
    const reqDone=DB.requests.filter(r=>r.completedAt&&isDay(r.completedAt)&&(r.history||[]).some(h=>h.by===u.id&&h.role==='exec'));
    dAll+=doneToday.length; oAll+=open.length; lAll+=late.length;
    L.push('');
    L.push('• '+u.name+' ('+u.id+') — '+u.title);
    L.push('   مهام أُنجزت اليوم: '+doneToday.length+(doneToday.length?(' | '+doneToday.map(t=>t.title+' ['+fmtDur(t.hours)+(t.lateDays?' - متأخرة '+t.lateDays+' يوم':'')+']').join('، ')):''));
    L.push('   معاملات نُفّذت اليوم: '+reqDone.length+(reqDone.length?(' | '+reqDone.map(r=>r.id+' '+TYPES[r.type].name).join('، ')):''));
    L.push('   مهام مفتوحة: '+open.length+'  |  متأخرة: '+late.length);
    late.forEach(t=>{
      const b=(t.blockers||[]).slice(-1)[0];
      L.push('      - متأخرة: '+t.title+' (استحقاق '+fmt(t.due)+' • تأخير '+(-daysLeft(t.due))+' يوم) — '+(b?('العائق: '+b.type+' — '+b.detail):'لم يُسجَّل سبب'));
    });
  });
  L.push('');
  L.push('='.repeat(46));
  L.push('الإجمالي: أُنجز اليوم '+dAll+' مهمة | مفتوحة '+oAll+' | متأخرة '+lAll);
  L.push('معاملات بانتظار اعتماد مدير الموارد البشرية: '+DB.requests.filter(r=>r.status==='pending'&&r.chain[r.step]&&r.chain[r.step].role==='hr').length);

function hrTeamList(){ return DB.employees.filter(e=>e.role==='hr_staff'||e.role==='hr'); }
function hrStats(u){
  const done=[], appr=[], rej=[], rep2=[]; let late=0, sum=0, last='';
  DB.requests.concat(DB.archive&&DB.archive.requests?DB.archive.requests:[]).forEach(r=>{
    (r.history||[]).forEach(h=>{
      if(h.by!==u.id&&h.byName!==u.name) return;
      if(h.at>last) last=h.at;
      if(h.act==='reject') rej.push(r);
      else if(h.act==='approve'){
        if(h.role==='exec'){ done.push(r);
          if(r.completedAt){ sum+=Math.max(0,(new Date(r.completedAt)-new Date(r.createdAt))/864e5); }
          if(r.dueAt&&r.completedAt&&r.completedAt.slice(0,10)>r.dueAt) late++;
        }
        else if(r.type==='inquiry') rep2.push(r);
        else appr.push(r);
      }
    });
  });
  const open=DB.requests.filter(r=>r.status==='processing'&&r.assignee===u.id).length;
  const tk=(DB.tasks||[]).filter(t=>t.assignee===u.id);
  const tdone=tk.filter(t=>t.status==='done');
  const th=tdone.filter(t=>t.hours!=null);
  const tAvg=th.length? th.reduce((a,t)=>a+t.hours,0)/th.length : null;
  const tLate=tk.filter(t=>t.lateDays>0||taskLate(t)).length;
  const tIssues=tk.reduce((a,t)=>a+((t.issues||[]).length),0);
  const tBlocks=tk.reduce((a,t)=>a+((t.blockers||[]).length),0);
  return {done:done.length,appr:appr.length,rej:rej.length,replies:rep2.length,open:open,late:late,
    avg:done.length?(sum/done.length).toFixed(1):'0.0',tasks:tk.length,tasksDone:tdone.length,
    tasksOpen:tk.filter(t=>t.status==='open').length,taskAvgH:tAvg,taskLate:tLate,issues:tIssues,blocks:tBlocks,last:last};
}

function distribute(){
  const staff=hrTeamList().filter(u=>u.role==='hr_staff');
  if(!staff.length){ toast('لا يوجد أعضاء في الفريق للتوزيع عليهم'); return; }
  const un=DB.requests.filter(r=>r.status==='processing'&&!r.assignee);
  if(!un.length){ toast('لا توجد معاملات غير مسندة'); return; }
  if(!confirm('توزيع '+un.length+' معاملة بالتساوي على '+staff.length+' من أعضاء الفريق؟')) return;
  const load={}; staff.forEach(u=>load[u.id]=hrStats(u).open);
  un.forEach(r=>{
    const target=staff.slice().sort((a,b)=>load[a.id]-load[b.id])[0];
    r.assignee=target.id; load[target.id]++;
    r.history.push({role:'exec',by:ME.id,byName:ME.name,byRole:ME.role,act:'assign',note:'توزيع تلقائي إلى '+target.name,at:new Date().toISOString()});
    notify(target.id,'معاملة مسندة إليك','المعاملة '+r.id+' أُسندت إليك ضمن توزيع الأعمال.',r.id);
  });
  save(); toast('وُزّعت '+un.length+' معاملة على الفريق'); render();
}
