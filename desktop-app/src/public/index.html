function editType(k){
  const t=k?TYPES[k]:{name:'',icon:'📄',desc:'',fields:[],execFields:[],chain:['hr_staff','hr'],exec:true,sla:5};
  modal(k?'✏️ تعديل خدمة':'＋ خدمة جديدة','<div class="row-2">'+
   '<div class="field"><label>اسم الخدمة *</label><input id="ty_n" value="'+esc(t.name)+'"></div>'+
   '<div class="field"><label>الأيقونة (رمز)</label><input id="ty_i" value="'+esc(t.icon)+'" placeholder="📄"></div>'+
   '<div class="field" style="grid-column:1/-1"><label>وصف مختصر</label><textarea id="ty_d">'+esc(t.desc||'')+'</textarea></div>'+
   '</div>'+(k?'':'<div class="note">بعد الحفظ حدّد حقول الخدمة ومسار اعتمادها.</div>'),
   '<button class="btn green" onclick="saveType('+(k?"'"+k+"'":'null')+')">حفظ</button><button class="btn ghost" onclick="closeModal()">إلغاء</button>');
}
function saveType(k){
  const n=$('ty_n').value.trim(); if(!n){ toast('اكتب اسم الخدمة'); return; }
  if(k){ TYPES[k].name=n; TYPES[k].icon=$('ty_i').value.trim()||'📄'; TYPES[k].desc=$('ty_d').value.trim(); }
  else{
    k='c'+Date.now();
    TYPES[k]={name:n,icon:$('ty_i').value.trim()||'📄',desc:$('ty_d').value.trim(),
      fields:[{k:'details',l:'تفاصيل الطلب',t:'textarea',req:1},{k:'file',l:'مرفق',t:'file'}],
      execFields:[{k:'ref',l:'رقم المرجع بعد التنفيذ',t:'text'}],chain:['hr_staff','hr'],exec:true,sla:5,custom:true};
    DB.settings.chains=DB.settings.chains||{};
    DB.settings.chains[k]={steps:['hr_staff','hr'],exec:true,sla:5};
  }
  DB.types[k]=TYPES[k]; save(); closeModal(); toast('حُفظت الخدمة'); FILTER.btab='svc'; render();
}
function toggleType(k){ TYPES[k].hidden=!TYPES[k].hidden; DB.types[k]=TYPES[k]; save(); toast(TYPES[k].hidden?'أُوقفت الخدمة':'فُعّلت الخدمة'); render(); }
function editFields(k,which){
  const t=TYPES[k], w=which||'fields', arr=t[w]||[];
  modal('🧩 حقول '+esc(t.name)+(w==='execFields'?' — حقول التنفيذ':''),

    '<button class="btn sm '+(w==='fields'?'':'ghost')+'" onclick="editFields(\''+k+'\',\'fields\')">حقول الطلب</button>'+
    '<button class="btn sm '+(w==='execFields'?'':'ghost')+'" onclick="editFields(\''+k+'\',\'execFields\')">حقول التنفيذ</button></div>'+
   (arr.length?'<table><thead><tr><th>الحقل</th><th>النوع</th><th>إلزامي</th><th></th></tr></thead><tbody>'+
    arr.map((f,i)=>'<tr><td>'+esc(f.l)+'</td><td class="mini">'+(FTYPES[f.t]||f.t)+'</td><td>'+(f.req?'نعم':'لا')+'</td>'+

    :'<div class="mini">لا توجد حقول.</div>')+

   '<div class="field"><label>النوع</label><select id="nf_t">'+Object.keys(FTYPES).map(x=>'<option value="'+x+'">'+FTYPES[x]+'</option>').join('')+'</select></div>'+
   '<div class="field"><label>خيارات القائمة <span class="hint">افصل بينها بفاصلة</span></label><input id="nf_o" placeholder="خيار1، خيار2"></div>'+
   '<div class="field"><label>إلزامي؟</label><select id="nf_r"><option value="0">لا</option><option value="1">نعم</option></select></div></div>',

function addField(k,w){
  const l=$('nf_l').value.trim(); if(!l){ toast('اكتب اسم الحقل'); return; }
  const t=$('nf_t').value, o=$('nf_o').value.split(/[،,]/).map(x=>x.trim()).filter(Boolean);
  if(t==='select'&&!o.length){ toast('أضف خيارات القائمة'); return; }
  TYPES[k][w]=TYPES[k][w]||[];
  TYPES[k][w].push({k:'f'+Date.now().toString(36),l,t,o:o.length?o:undefined,req:$('nf_r').value==='1'?1:0});
  DB.types[k]=TYPES[k]; save(); toast('أُضيف الحقل'); editFields(k,w);
}
function delField(k,w,i){ TYPES[k][w].splice(i,1); DB.types[k]=TYPES[k]; save(); editFields(k,w); }
function moveField(k,w,i,d){ const a=TYPES[k][w], j=i+d; if(j<0||j>=a.length)return; const x=a[i];a[i]=a[j];a[j]=x; DB.types[k]=TYPES[k]; save(); editFields(k,w); }

function saveEmpField(i){

function vNations(){
  const act=DB.employees.filter(e=>e.active);
  const cnt={}; act.forEach(e=>cnt[e.nationality]=(cnt[e.nationality]||0)+1);
  const rows=Object.entries(cnt).sort((a,b)=>b[1]-a[1]);
  const mx=Math.max(1,...rows.map(r=>r[1]));
  const saudi=cnt['سعودي']||0;
  const perBranch=n=>BRANCHES.map(b=>act.filter(e=>e.nationality===n&&e.branch===b.id).length);
  return '<div class="grid g4" style="margin-bottom:16px">'+
   '<div class="kpi b"><div class="ic">🌍</div><div class="lb">عدد الجنسيات في المنشأة</div><div class="vl num">'+rows.length+'</div><div class="ft">من أصل '+NATIONS.length+' جنسية معتمدة</div></div>'+
   '<div class="kpi g"><div class="ic">🇸🇦</div><div class="lb">نسبة السعودة</div><div class="vl num">'+Math.round(saudi/Math.max(1,act.length)*100)+'%</div><div class="ft">'+saudi+' موظف سعودي</div></div>'+
   '<div class="kpi o"><div class="lb">أكبر جنسية وافدة</div><div class="vl" style="font-size:20px">'+esc((rows.filter(r=>r[0]!=='سعودي')[0]||['—'])[0])+'</div><div class="ft"><span class="num">'+((rows.filter(r=>r[0]!=='سعودي')[0]||[0,0])[1])+'</span> موظف</div></div>'+
   '<div class="kpi p"><div class="lb">إجمالي الوافدين</div><div class="vl num">'+(act.length-saudi)+'</div><div class="ft">'+Math.round((act.length-saudi)/Math.max(1,act.length)*100)+'% من القوى العاملة</div></div></div>'+
  '<div class="card"><div class="hd"><h3>الجنسيات وأعدادها</h3>'+
   (can('settings')?'<button class="btn sm ghost no-print" onclick="manageNations()">إدارة قائمة الجنسيات</button>':'')+
   '<button class="btn sm ghost" onclick="exportNations()">⭳ تصدير CSV</button></div>'+
   '<div style="overflow-x:auto"><table><thead><tr><th>#</th><th>الجنسية</th><th>العدد</th><th>النسبة</th><th>التوزيع</th>'+
    BRANCHES.map(b=>'<th>'+esc(b.city)+'</th>').join('')+'</tr></thead><tbody>'+
   rows.map((r,i)=>'<tr class="clickable" onclick="FILTER={n:\''+r[0]+'\'};VIEW=\'staff\';render()"><td class="num">'+(i+1)+'</td><td><b>'+esc(r[0])+'</b></td>'+
    '<td class="num">'+r[1]+'</td><td class="num">'+(r[1]/act.length*100).toFixed(1)+'%</td>'+
    '<td style="min-width:130px"><div class="bar-track"><div class="bar-fill" style="width:'+Math.round(r[1]/mx*100)+'%"></div></div></td>'+
    perBranch(r[0]).map(v=>'<td class="num">'+v+'</td>').join('')+'</tr>').join('')+
   '</tbody></table></div></div>';
}
function exportNations(){
  const act=DB.employees.filter(e=>e.active), cnt={};
  act.forEach(e=>cnt[e.nationality]=(cnt[e.nationality]||0)+1);
  downloadCsv('nationalities.csv',[['الجنسية','العدد','النسبة'].concat(BRANCHES.map(b=>b.city))]
   .concat(Object.entries(cnt).sort((a,b)=>b[1]-a[1]).map(r=>[r[0],r[1],(r[1]/act.length*100).toFixed(1)+'%']
    .concat(BRANCHES.map(b=>act.filter(e=>e.nationality===r[0]&&e.branch===b.id).length)))));
}

function pmToggle(){
  const m=$('pm_mode').value;
  if($('pm_set')) $('pm_set').style.display = m==='set'?'block':'none';
  if($('pm_send')) $('pm_send').style.display = m==='gen'?'block':'none';
}
function genPass(){
  const a='ABCDEFGHJKLMNPQRSTUVWXYZ', b='abcdefghijkmnopqrstuvwxyz', c='23456789';
  let p=''; for(let i=0;i<3;i++) p+=b[Math.floor(Math.random()*b.length)];
  p+=a[Math.floor(Math.random()*a.length)];
  for(let i=0;i<4;i++) p+=c[Math.floor(Math.random()*c.length)];
  return p;
}
async function passApply(id){
  const e=emp(id), mode=$('pm_mode').value, force=$('pm_force').value==='1', err=$('pmErr');
  let np='';
  if(mode==='set'){
    const a=$('pm_p1').value, b=$('pm_p2').value;
    if(a.length<6){ err.innerHTML='<div class="err">كلمة المرور 6 خانات على الأقل.</div>'; return; }
    if(a!==b){ err.innerHTML='<div class="err">كلمتا المرور غير متطابقتين.</div>'; return; }
    np=a;
  } else if(mode==='reset'){ np='123456'; } else { np=genPass(); }
  e.pass=np; e.mustChangePass=force; e.passChangedAt=new Date().toISOString();
  await save();
  if(mode==='gen'){
    const via=$('pm_via')?$('pm_via').value:'show';
    const txt='مرحباً '+e.name+'، كلمة المرور الجديدة لحسابك في نظام الموارد البشرية: '+np+

function saveDoc(id){
  const o={type:$('dc_t').value,branch:$('dc_b').value,no:$('dc_n').value,authority:$('dc_a').value,issue:$('dc_i').value,expiry:$('dc_e').value};
  if(id){
    const d=DB.docs.find(x=>x.id===id), old=d.expiry, oldNo=d.no;
    Object.assign(d,o);
    d.updatedBy=ME.name; d.updatedAt=new Date().toISOString();
    if(old!==d.expiry||oldNo!==d.no){
      d.renewals=d.renewals||[];
      d.renewals.push({from:old,to:d.expiry,no:(oldNo!==d.no?d.no:''),by:ME.name,at:d.updatedAt});
      notify('role:hr','تحديث وثيقة منشأة',d.type+' – '+brName(d.branch)+' حُدّثت بواسطة '+ME.name+'. الانتهاء الجديد: '+fmt(d.expiry));
      notify('role:hr_staff','تحديث وثيقة منشأة',d.type+' – '+brName(d.branch)+' • الانتهاء: '+fmt(d.expiry)+' • بواسطة '+ME.name);
      Object.keys(DB.alerted||{}).forEach(k=>{ if(k.indexOf('d'+id+'|')===0||k.indexOf('dh'+id+'|')===0) delete DB.alerted[k]; });
    }
  } else {
    o.id='D'+Date.now().toString(36); o.updatedBy=ME.name; o.updatedAt=new Date().toISOString(); o.renewals=[];
    DB.docs.push(o);
    notify('role:hr','إضافة وثيقة منشأة',o.type+' – '+brName(o.branch)+' أُضيفت بواسطة '+ME.name+'.');
  }
  save(); closeModal(); toast('حُفظت الوثيقة'); render();
}

function vReports(){
  const emps=DB.employees.filter(e=>e.active);
  const byDept={}, byNat={}, st={pending:0,processing:0,completed:0,rejected:0,cancelled:0};
  emps.forEach(e=>{byDept[e.dept]=(byDept[e.dept]||0)+1;byNat[e.nationality]=(byNat[e.nationality]||0)+1;});
  DB.requests.forEach(r=>st[r.status]++);
  const saudi=emps.filter(e=>e.nationality==='سعودي').length;
  const done=DB.requests.filter(r=>r.completedAt);
  const avg=done.length?(done.reduce((a,r)=>a+Math.max(0,(new Date(r.completedAt)-new Date(r.createdAt))/864e5),0)/done.length).toFixed(1):0;
  const bar=(o,lbl)=>{const mx=Math.max(1,...Object.values(o));return Object.entries(o).sort((a,b)=>b[1]-a[1]).map(([k,v])=>
   '<div class="bar-row"><div class="lb">'+esc(lbl?lbl(k):k)+'</div><div class="bar-track"><div class="bar-fill" style="width:'+Math.round(v/mx*100)+'%"></div></div><div class="vl num">'+v+'</div></div>').join('');};
  return '<div class="grid g4" style="margin-bottom:16px">'+
   '<div class="kpi g"><div class="lb">نسبة السعودة</div><div class="vl num">'+Math.round(saudi/Math.max(1,emps.length)*100)+'%</div><div class="ft">'+saudi+' موظف سعودي</div></div>'+
   '<div class="kpi b"><div class="lb">إجمالي المعاملات</div><div class="vl num">'+DB.requests.length+'</div><div class="ft">'+st.completed+' منجزة</div></div>'+
   '<div class="kpi p"><div class="lb">متوسط زمن الإنجاز</div><div class="vl num">'+avg+'</div><div class="ft">يوم من التقديم للإنجاز</div></div>'+
   '<div class="kpi r"><div class="lb">نسبة الرفض</div><div class="vl num">'+Math.round(st.rejected/Math.max(1,DB.requests.length)*100)+'%</div><div class="ft">'+st.rejected+' معاملة</div></div></div>'+
  '<div class="grid g2">'+
   '<div class="card"><div class="hd"><h3>الموظفون حسب القسم</h3></div><div class="bd">'+bar(byDept)+'</div></div>'+
   '<div class="card"><div class="hd"><h3>الجنسيات</h3></div><div class="bd">'+bar(byNat)+'</div></div>'+
   '<div class="card"><div class="hd"><h3>حالات المعاملات</h3></div><div class="bd">'+bar(st,k=>({pending:'بانتظار الاعتماد',processing:'قيد التنفيذ',completed:'منجزة',rejected:'مرفوضة',cancelled:'ملغاة'}[k]))+'</div></div>'+
   '<div class="card"><div class="hd"><h3>المعاملات حسب الفرع</h3></div><div class="bd">'+(()=>{const o={};DB.requests.forEach(r=>{const e=emp(r.empId);if(e)o[e.branch]=(o[e.branch]||0)+1;});return bar(o,k=>brName(k));})()+'</div></div></div>';
}

async function setDesktopMode(mode){
  if(!SRV||!TOKEN)return;
  const r=await fetch(SRV+'/mode.php',{method:'PUT',headers:hdrs(),body:JSON.stringify({mode})});
  if(!r.ok){toast('تعذر تغيير وضع الاتصال');return;} DESKTOP_MODE=mode; toast(mode==='online'?'تم تفعيل سيرفر الشركة كمصدر رئيسي':'تم تفعيل النسخة المحلية الاحتياطية'); location.reload();
}
async function syncDesktopQueue(){
  if(!SRV||!TOKEN)return; const r=await fetch(SRV+'/sync.php',{method:'POST',headers:hdrs(),body:'{}'}),j=await r.json();
  if(!r.ok){toast('تعذرت المزامنة — تحقق من الاتصال');return;} toast('تمت مزامنة '+(j.synced||0)+' عملية'+(j.conflicts?' وحُفظ '+j.conflicts+' تعارض للمراجعة':'')); location.reload();
}
async function viewSyncConflicts(){
  const r=await fetch(SRV+'/conflicts.php',{headers:hdrs(),cache:'no-store'}),j=await r.json(),items=j.items||[];
  modal('⚠️ تعارضات المزامنة المحفوظة',items.length?'<div class="note warn" style="margin-bottom:12px">لم تُحذف التعديلات المحلية التالية. راجعها قبل تطبيقها يدوياً على أحدث بيانات السيرفر.</div>'+items.slice().reverse().map(c=>'<div class="card" style="padding:12px;margin-bottom:8px"><b>عملية '+esc(c.id)+'</b><div class="mini">'+fmtT(c.detectedAt)+' • الإصدار المحلي '+esc((c.local||{}).baseVersion||'—')+' • إصدار السيرفر '+esc((c.remote||{}).version||'—')+'</div></div>').join(''):'<div class="empty">لا توجد تعارضات محفوظة.</div>','<button class="btn ghost" onclick="closeModal()">إغلاق</button>');

function saveChain(tk){
  const opts=['manager','branch','hr_branch','gm','hr_staff','hr'], steps=opts.filter(o=>$('ch_'+o).checked);
  if(!steps.length){ toast('اختر مرحلة اعتماد واحدة على الأقل'); return; }
  DB.settings.chains=DB.settings.chains||{};
  DB.settings.chains[tk]={steps,exec:$('ch_exec').value==='1',sla:+$('ch_sla').value||3};
  save(); closeModal(); toast('حُدّث مسار الخدمة'); render();

function editBranch(id){

   '<div class="field"><label>اسم الفرع</label><input id="br_n" value="'+esc(b.name)+'"></div>'+

function saveBranch(id){
  const n=$('br_n').value.trim(), c=$('br_c').value.trim();
  if(!n||!c){ toast('أكمل اسم الفرع والمدينة'); return; }
  if(id){ const b=BRANCHES.find(x=>x.id===id); b.name=n; b.city=c; }
  else { const nid='B'+(BRANCHES.length+1+Math.floor(rnd()*90)); BRANCHES.push({id:nid,name:n,city:c}); }
  DB.branches=BRANCHES; save(); closeModal(); toast('حُفظ الفرع'); render();
}

function saveDept(){
  const v=$('dp_new').value.trim();

function delDept(d){
  if(DB.employees.some(e=>e.dept===d)){ toast('لا يمكن الحذف — يوجد موظفون في القسم'); return; }

function parseTable(txt){
  txt=String(txt||'').replace(/^\uFEFF/,'').trim();
  if(!txt) return [];
  const sep = txt.indexOf('\t')>=0 && (txt.indexOf('\t')<txt.indexOf(',')||txt.indexOf(',')<0) ? '\t' : ',';
  const rows=[]; let cur=[], val='', q=false;
  for(let i=0;i<txt.length;i++){
    const c=txt[i];
    if(q){ if(c==='"'){ if(txt[i+1]==='"'){val+='"';i++;} else q=false; } else val+=c; }
    else if(c==='"') q=true;
    else if(c===sep){ cur.push(val); val=''; }
    else if(c==='\n'){ cur.push(val); rows.push(cur); cur=[]; val=''; }
    else if(c!=='\r') val+=c;
  }
  cur.push(val); if(cur.length>1||cur[0]!=='') rows.push(cur);
  return rows.map(r=>r.map(x=>String(x).trim()));
}
function mapRows(rows){
  if(!rows.length) return {cols:[],data:[]};
  const head=rows[0].map(h=>IMP_MAP[h.trim()]||IMP_MAP[h.trim().replace(/\s+/g,' ')]||null);
  const data=rows.slice(1).filter(r=>r.some(x=>x)).map(r=>{
    const o={}; head.forEach((k,i)=>{ if(k&&r[i]!==undefined&&r[i]!=='') o[k]=r[i]; }); return o;
  });
  return {cols:head,raw:rows[0],data};
}

function findBranch(v){
  if(!v) return BRANCHES[0].id;
  const t=String(v).trim();
  const b=BRANCHES.find(x=>x.id===t||x.name===t||x.city===t||x.name.indexOf(t)>=0||t.indexOf(x.city)>=0);
  return b?b.id:BRANCHES[0].id;
}
function normDate(v){
  if(!v) return '';
  const t=String(v).trim().replace(/\//g,'-');
  const m=t.match(/^(\d{1,2})-(\d{1,2})-(\d{4})$/);
  if(m) return m[3]+'-'+pad(m[2])+'-'+pad(m[1]);
  const m2=t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m2) return m2[1]+'-'+pad(m2[2])+'-'+pad(m2[3]);
  return t;
}

   '<div class="note ok" style="margin-bottom:14px">سلّم الموظف هذه البيانات ليتمكن من الدخول.</div>'+

/* ---------- التصدير ---------- */
function downloadCsv(name,rows){
  const csv='\ufeff'+rows.map(r=>r.map(c=>'"'+String(c==null?'':c).replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download=name; a.click(); toast('جارٍ التنزيل');
}
function exportEmps(){ downloadCsv('employees.csv',[['الرقم','الاسم','المسمى','القسم','الفرع','الجوال','الجنسية','الإقامة','انتهاء الإقامة','نهاية العقد','التأمين','انتهاء التأمين','رصيد الإجازة']]
 .concat(DB.employees.map(e=>[e.id,e.name,e.title,e.dept,brName(e.branch),e.mobile,e.nationality,e.iqama,e.iqamaExpiry||'',e.contractEnd||'',(e.insurance||{}).company||'',(e.insurance||{}).expiry||'',e.leaveBalance]))); }
function exportIqama(){ const l=DB.employees.filter(e=>e.iqamaExpiry&&daysLeft(e.iqamaExpiry)<=DB.settings.alertIqama);
 downloadCsv('iqama-alerts.csv',[['الرقم','الاسم','الفرع','رقم الإقامة','الانتهاء','المتبقي']].concat(l.map(e=>[e.id,e.name,brName(e.branch),e.iqama,e.iqamaExpiry,daysLeft(e.iqamaExpiry)]))); }
function exportContracts(){ const l=DB.employees.filter(e=>e.active&&e.contractEnd&&daysLeft(e.contractEnd)<=DB.settings.alertContract);

function exportIns(){ const l=DB.employees.filter(e=>e.active&&e.insurance&&daysLeft(e.insurance.expiry)<=DB.settings.alertIns);
 downloadCsv('insurance.csv',[['الرقم','الاسم','الشركة','الفئة','الوثيقة','الانتهاء']].concat(l.map(e=>[e.id,e.name,e.insurance.company,e.insurance.cls,e.insurance.policy,e.insurance.expiry]))); }
function exportReq(){ downloadCsv('requests.csv',[['رقم المعاملة','الخدمة','الموظف','الرقم','الفرع','التقديم','المرحلة','الحالة','الإنجاز']]
 .concat(DB.requests.map(r=>{const e=emp(r.empId);return [r.id,TYPES[r.type].name,e?e.name:'',r.empId,e?brName(e.branch):'',fmt(r.createdAt),stageLabel(r),
  ({pending:'بانتظار الاعتماد',processing:'قيد التنفيذ',completed:'منجزة',rejected:'مرفوضة',cancelled:'ملغاة'})[r.status],r.completedAt?fmt(r.completedAt):''];}))); }

/* ---------- Modal ---------- */
function modal(title,bodyHtml,footHtml,locked){
  closeModal();
  const bg=document.createElement('div'); bg.className='modal-bg'; bg.id='mbg';
  bg.innerHTML='<div class="modal"><div class="hd"><h3>'+title+'</h3>'+(locked?'':'<button class="x" onclick="closeModal()">×</button>')+'</div><div class="bd">'+bodyHtml+'</div><div class="ft">'+(footHtml||'')+'</div></div>';
  if(!locked) bg.onclick=e=>{ if(e.target===bg) closeModal(); };
  document.body.appendChild(bg);
  translateDOM(bg);
}
function closeModal(){ const m=$('mbg'); if(m) m.remove(); }

async function forceUpdate(){
  toast('جارٍ التحقق من وجود تحديث…');
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      for(const r of regs){ await r.update().catch(()=>{}); }
    }
    if(window.caches){ const ks=await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k))); }
  }catch(e){}
  location.reload(true);
}
async function syncNow(){
  if(!SRV){ toast('النظام يعمل بتخزين المتصفح — للحفظ المركزي شغّل خادم الشركة'); return; }
  const cur=SRV_VER; await pullDB();
  if(MEM[KEY]){ DB=MEM[KEY]; if(ME) ME=DB.employees.find(x=>x.id===ME.id)||ME; }
  toast(SRV_VER!==cur?'حُدّثت البيانات من السيرفر':'بياناتك محدّثة');
  render();
}
async function autoSync(){
  if(!SRV||!ME||document.getElementById('mbg')) return;
  try{
    const r=await fetch(SRV+'/ping.php',{cache:'no-store'});
    const j=await r.json();
    if(j&&j.version&&j.version!==SRV_VER){
      await pullDB();
      if(MEM[KEY]){ DB=MEM[KEY]; ME=DB.employees.find(x=>x.id===ME.id)||ME; render(); }
    }
  }catch(e){}
}
