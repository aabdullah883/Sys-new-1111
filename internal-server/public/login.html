<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دخول لوحة الإدارة</title><link rel="stylesheet" href="/style.css"></head><body class="login-page"><form id="login" class="login-card"><h1>لوحة السيرفر الداخلي</h1><p>نظام الموارد البشرية — شركة السلمان</p><label>اسم المستخدم<input id="username" autocomplete="username" required></label><label>كلمة المرور<input id="password" type="password" autocomplete="current-password" required></label><div id="error" class="error"></div><button>تسجيل الدخول</button></form><script>login.onsubmit=async e=>{e.preventDefault();error.textContent='';const r=await fetch('/admin/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:username.value,password:password.value})});if(r.ok)location.href='/';else error.textContent='بيانات الدخول غير صحيحة';};</script></body></html>
